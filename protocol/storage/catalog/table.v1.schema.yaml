# Storage contract for a persisted physical table record, stored under the
# catalog_table and catalog_table_object keyspaces.
# Released properties are permanent; see protocol/README.md for the
# storage-schema compatibility rules.
$schema: https://json-schema.org/draft/2020-12/schema
title: catalog/table.v1
description: >-
  One physical table: its permanent identities, its columns and their
  physical representations, and the derived structures writes must maintain.
  The catalog_table keyspace holds the live record per physical table; the
  catalog_table_object keyspace holds one immutable copy per definition
  generation.
type: object
additionalProperties: false
required: [format, record]
properties:
  format:
    description: Payload serialization format discriminator.
    type: integer
    enum: [1]
  record:
    description: One physical table definition.
    type: object
    additionalProperties: false
    required: [id, schema_id, name]
    properties:
      id:
        description: >-
          Permanent physical table identity, `t` plus a decimal from the
          shared identity counter. Never reused.
        type: string
      schema_id:
        description: >-
          Logical schema identity from the authored schema. Never reused;
          survives physical replacement of the table.
        type: integer
      name:
        description: Current user-visible table name. Mutable, never identity.
        type: string
      definition_generation:
        description: >-
          Monotonic generation of this table's definition. Advances on every
          published definition change. Absent means zero.
        type: integer
      existence_generation:
        description: >-
          Generation checked by the table-existence fence. Advancing it
          invalidates pinned work that assumed the table still exists.
          Absent means zero.
        type: integer
      write_protocol_generation:
        description: >-
          Generation of the write protocol this table's writers must follow.
          Matches the catalog_write_protocol_fence value. Absent means zero.
        type: integer
      storage_generation:
        description: >-
          Authoritative physical storage generation for this table's rows.
          Data keys embed it between table identity and row identity so a
          replacement physical representation is built beside the
          authoritative one and activated with one catalog switch. Absent
          means generation 1.
        type: integer
      columns:
        description: The table's columns in declaration order.
        type: array
        items:
          description: One physical column.
          type: object
          additionalProperties: false
          required: [id, schema_id, name, type, nullable]
          properties:
            id:
              description: >-
                Permanent physical column identity, `c` plus a decimal.
                Never reused, and the scalar type bound to it never changes
                in place: row bodies address cells by this identity.
              type: string
            schema_id:
              description: Logical schema identity of the column. Never reused.
              type: integer
            name:
              description: Current column name. Mutable, never identity.
              type: string
            value_generation:
              description: >-
                Generation checked by the column-value fence. Advancing it
                invalidates pinned work that assumed the column's stored
                values kept their meaning. Absent means zero.
              type: integer
            type:
              description: Scalar type of every stored cell in this column.
              type: string
              enum: [text, int64, float64, bool]
            nullable:
              description: Whether stored cells may be null.
              type: boolean
            format:
              description: >-
                Authored format annotation, for example `uuid`. Carried for
                clients and generators; storage does not interpret it.
              type: string
            insert_default:
              description: Default applied when an insert omits the column.
              type: object
              additionalProperties: false
              properties:
                func:
                  description: >-
                    Generator function. Present when the default is generated
                    per row instead of a literal.
                  type: string
                  enum: [uuid, now_ms, increment]
                text:
                  description: Literal used when the column type is text.
                  type: string
                int64:
                  description: Literal used when the column type is int64.
                  type: integer
                float64:
                  description: Literal used when the column type is float64.
                  type: number
                bool:
                  description: Literal used when the column type is bool.
                  type: boolean
            missing_value:
              description: >-
                Literal supplied for cells absent from stored rows, so column
                addition never rewrites rows. Absent columns decode as null
                when no missing value is declared. Generator functions are
                not permitted here.
              type: object
              additionalProperties: false
              properties:
                func:
                  description: >-
                    Generator function. Never valid for missing values;
                    present in the shape because the default-value form is
                    shared.
                  type: string
                  enum: [uuid, now_ms, increment]
                text:
                  description: Literal used when the column type is text.
                  type: string
                int64:
                  description: Literal used when the column type is int64.
                  type: integer
                float64:
                  description: Literal used when the column type is float64.
                  type: number
                bool:
                  description: Literal used when the column type is bool.
                  type: boolean
      primary_key:
        description: >-
          Column names forming the primary key, in key order. The encoded
          key tuple is the row's identity inside the data keyspace.
        type: array
        items:
          description: One primary-key column name.
          type: string
      indexes:
        description: The table's secondary indexes.
        type: array
        items:
          description: One physical index incarnation.
          type: object
          additionalProperties: false
          required: [id, name, unique]
          properties:
            id:
              description: >-
                Physical index incarnation, `i` plus a decimal. Every build
                allocates a fresh one, so a replacement index is always
                constructed beside the authoritative one.
              type: string
            logical_id:
              description: >-
                Stable logical index identity, `ix` plus a decimal. Survives
                rebuilds; names the index across physical incarnations.
              type: string
            definition_generation:
              description: >-
                Monotonic generation of the index definition. Absent means
                zero.
              type: integer
            access_generation:
              description: >-
                Generation checked by the index-access fence. Advancing it
                invalidates pinned plans that read the index. Absent means
                zero.
              type: integer
            state:
              description: >-
                Build lifecycle state. The empty string and `ready` are both
                readable states; every other state belongs to an index under
                construction or removal.
              type: string
              enum: ["", building, catching_up, validating, ready, deleting, failed, cancelled]
            name:
              description: Current index name. Mutable, never identity.
              type: string
            columns:
              description: Indexed column names in index order.
              type: array
              items:
                description: One indexed column name.
                type: string
            column_ids:
              description: >-
                Physical column identities matching `columns` by position,
                so renames never break the index definition.
              type: array
              items:
                description: One physical column identity.
                type: string
            unique:
              description: Whether the index enforces uniqueness.
              type: boolean
      foreign_keys:
        description: Foreign keys declared on this table.
        type: array
        items:
          description: One foreign key.
          type: object
          additionalProperties: false
          required: [id, name, ref_table_id]
          properties:
            id:
              description: >-
                Permanent foreign-key identity, `fk` plus a decimal. Never
                reused.
              type: string
            name:
              description: Current foreign-key name. Mutable, never identity.
              type: string
            columns:
              description: Referencing column names on this table.
              type: array
              items:
                description: One referencing column name.
                type: string
            ref_table_id:
              description: Physical identity of the referenced table.
              type: string
            ref_columns:
              description: Referenced column names on the target table.
              type: array
              items:
                description: One referenced column name.
                type: string
      constraints:
        description: Declared constraints and their validation states.
        type: array
        items:
          description: One constraint.
          type: object
          additionalProperties: false
          required: [id, definition_generation, name, kind, state]
          properties:
            id:
              description: >-
                Permanent constraint identity, `ct` plus a decimal. Never
                reused.
              type: string
            definition_generation:
              description: Definition generation that introduced the constraint.
              type: integer
            name:
              description: Current constraint name. Mutable, never identity.
              type: string
            kind:
              description: Constraint family.
              type: string
              enum: [not_null]
            state:
              description: >-
                Validation lifecycle state. `valid` constraints are enforced
                and proven; `enforcing_new_writes` and
                `validating_existing_data` constraints reject new violations
                while existing rows are checked.
              type: string
              enum: [declared, enforcing_new_writes, validating_existing_data, valid, failed, cancelled]
            column_ids:
              description: Physical column identities the constraint covers.
              type: array
              items:
                description: One physical column identity.
                type: string
