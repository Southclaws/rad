# yaml-language-server: $schema=https://raw.githubusercontent.com/opencli-dev/opencli/main/schema/opencli.schema.json
$schema: https://raw.githubusercontent.com/opencli-dev/opencli/main/schema/opencli.schema.json

opencli: "1.0.0"

info:
  title: rad
  binaryName: rad
  version: "0.1.0"
  description: The radically different database.

exitCodes:
  - code: 0
    label: OK
    description: The command completed successfully.
  - code: 1
    label: Error
    description: The command could not complete.

commands:
  - name: init
    operationId: init
    description: Initialize a Rad project.
    longDescription: >
      Create rad.config.yaml and rad.schema.yaml in a new or existing project
      directory. In a terminal, Rad guides you through the small set of project
      choices. Use --yes to accept defaults without prompts. Existing project
      files are never overwritten, and accepted rad.state is created only by a
      successful schema migration or pull.
    arguments:
      - name: DIRECTORY
        description: Directory to initialize.
        type: path
        required: false
        default: .
    flags:
      - name: database-url
        description: Rad database URL written to the project configuration.
        default: rad://127.0.0.1:7237
      - name: out
        short: o
        description: Generated Go client output directory.
        type: path
        default: generated
      - name: pkg
        description: Generated Go package name.
        default: db
      - name: no-generate
        description: Do not configure generated client output.
        type: boolean
      - name: empty
        description: Create an empty schema instead of the starter users table.
        type: boolean
      - name: yes
        short: y
        description: Accept supplied values and defaults without prompting.
        type: boolean

  - name: serve
    operationId: serve
    description: Run the Rad database server.
    flags:
      - name: addr
        description: HTTP server listen address.
        envVar: RAD_ADDR
        default: 0.0.0.0:7237
      - name: storage
        description: Storage backend.
        envVar: RAD_STORAGE
        choices: [memory, file, s3]
        default: file
      - name: db
        short: d
        description: File storage directory.
        type: path
        envVar: RAD_DATA_DIR
        default: data
      - name: storage-path
        description: Logical SlateDB path within the selected backend.
        envVar: RAD_STORAGE_PATH
        default: rad
      - name: catalog-mode
        description: Catalog mode for a fresh database; immutable after initialization.
        envVar: RAD_CATALOG_MODE
        choices: [direct, schema]
      - name: s3-bucket
        description: S3 bucket used by the s3 storage backend.
        envVar: RAD_S3_BUCKET
      - name: s3-prefix
        description: S3 object prefix; defaults to --storage-path.
        envVar: RAD_S3_PREFIX
      - name: s3-region
        description: S3 region.
        envVar: RAD_S3_REGION
      - name: s3-endpoint
        description: Custom S3-compatible endpoint, such as RustFS.
        envVar: RAD_S3_ENDPOINT

  - name: validate
    operationId: validate
    description: Validate a rad.schema.yaml file.
    longDescription: >
      Parse and validate the schema structure, types, and references locally
      without calling out to the remote database.
    flags:
      - $ref: "#/components/flags/schema-file"

  - name: schema
    description: Inspect and manage the database schema.
    flags:
      - $ref: "#/components/flags/config-file"
      - $ref: "#/components/flags/schema-file"
    commands:
      - name: status
        operationId: schemaStatus
        description: Compare server, accepted, desired, and generated schemas.
      - name: diff
        operationId: schemaDiff
        description: Show desired schema changes and data preflight findings.
        flags:
          - name: format
            description: Output format.
            choices: [text, json]
            default: text
      - name: migrate
        operationId: schemaMigrate
        description: Apply rad.schema.yaml transactionally.
        flags:
          - name: accept-data-loss
            description: Permit explicitly reported destructive changes.
            type: boolean
          - name: no-generate
            description: Do not regenerate configured clients.
            type: boolean
      - name: pull
        operationId: schemaPull
        description: Recover the accepted schema from the database.
        flags:
          - name: force
            description: Back up and replace a locally modified schema.
            type: boolean
          - name: no-generate
            description: Do not regenerate configured clients.
            type: boolean

  - name: generate
    operationId: generate
    description: Generate a typed client for the accepted schema.
    longDescription: >
      Generate a typed client from the accepted schema state recorded by rad
      schema migrate or rad schema pull. The lockfile points to an immutable
      changelog snapshot so generation cannot silently target unapplied local
      schema changes. rad generate reads this state; it does not create it.
    flags:
      - $ref: "#/components/flags/schema-file"
      - name: out
        short: o
        description: Output directory.
        type: path
        default: generated
      - name: pkg
        description: Generated package or client name.
        default: db
      - name: lang
        description: Client language.
        choices: [go]
        default: go

components:
  flags:
    config-file:
      name: config
      description: Project configuration file.
      type: file
      default: rad.config.yaml
    schema-file:
      name: file
      short: f
      description: Desired schema file.
      type: file
      default: rad.schema.yaml
