openapi: 3.0.3

info:
  contact:
    name: Barnaby Keene
  description: >
    The Rad wire protocol: a small JSON over HTTP surface that clients and a
    Rad server speak to each other.


    Rad is reached over a `rad://` (or `rads://` for HTTPS) connection URI
    which resolves to an HTTP base URL. Rad speaks plain HTTP; front it with
    your own proxy for encryption or authentication and use `rads://` so the
    client dials it over HTTPS. Rad never terminates TLS itself. The default
    port is 7237.


    This document is the contract. Every operation describes what it does, what
    it returns, and how it fails, in enough detail to serve as the basis for
    acceptance tests. The protocol is deliberately unversioned: Rad is a proof
    of concept and makes no backwards compatibility guarantees yet.


    Errors are returned as RFC 7807 Problem Details with the
    `application/problem+json` media type. The `code` member is the stable,
    machine readable discriminator (`invalid`, `not_found`, `conflict`,
    `internal`) and clients should switch on it rather than parsing the `type`
    URI or the HTTP status.
  title: rad
  version: "v0"

servers:
  - url: "/"
    description: >
      The server mounts every operation at the root. A `rad://host:7237`
      connection URI maps directly onto `http://host:7237/`.

tags:
  - name: meta
    description: Liveness and schema introspection.
  - name: schema
    description: Reconciling the database with a schema.rad file.
  - name: catalog
    description: >
      Imperative catalog mutation: creating, updating, and deleting tables,
      columns, and indexes over the API. Available only on directly managed
      databases; a schema-managed database rejects every operation in this
      group with an `invalid` problem, since its catalog is owned by
      `schema.rad` migrations.
  - name: data
    description: Reading and writing rows against committed state.
  - name: transactions
    description: Server held serializable transactions.

paths:
  /health:
    get:
      operationId: GetHealth
      summary: Check that the server is alive.
      description: |
        A cheap liveness probe that touches no storage. It always returns `200`
        with a small status body while the process is serving, so it is safe to
        use as a readiness check or a `rad://` reachability test before opening
        a connection.
      tags: [meta]
      responses:
        default: { $ref: "#/components/responses/InternalServerError" }
        "200": { $ref: "#/components/responses/GetHealthOK" }

  /tables:
    get:
      operationId: TableList
      summary: List the tables in the database.
      description: |
        Return every table currently defined in the catalog, along with its
        columns and primary key. This reflects the schema as it exists right
        now, after the most recent successful migration. An empty database
        returns an empty list, not an error.

        Use this to introspect a running server without access to the original
        `schema.rad` file.
      tags: [meta]
      responses:
        default: { $ref: "#/components/responses/InternalServerError" }
        "200": { $ref: "#/components/responses/TableListOK" }
    post:
      operationId: TableCreate
      summary: Create a table.
      description: |
        Define a new table in one call: columns, primary key, and optionally
        indexes and foreign keys, exactly as a `schema.rad` entry would. IDs
        are assigned by the catalog and the whole definition commits
        atomically — a rejected definition leaves nothing behind, including
        the name.

        Foreign keys may reference existing tables or the table being created
        (self-references), and must target the referenced table's full
        primary key. A definition that fails validation — duplicate or
        missing name, unsupported column type, nullable primary key column,
        index or key over unknown columns — is rejected with an `invalid`
        problem. On a schema-managed database this operation is always
        rejected.
      tags: [catalog]
      requestBody: { $ref: "#/components/requestBodies/TableCreate" }
      responses:
        default: { $ref: "#/components/responses/InternalServerError" }
        "200": { $ref: "#/components/responses/TableOK" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /tables/{table}:
    patch:
      operationId: TableUpdate
      summary: Update a table.
      description: |
        Update a table's properties. The only updatable property today is
        `name`: data keys use the table's ID, so a name change is
        metadata-only and instantaneous, and foreign keys referencing the
        table are unaffected. A name that is already taken is rejected with
        an `invalid` problem. On a schema-managed database this operation is
        always rejected.
      tags: [catalog]
      parameters:
        - { $ref: "#/components/parameters/TableName" }
      requestBody: { $ref: "#/components/requestBodies/TableUpdate" }
      responses:
        default: { $ref: "#/components/responses/InternalServerError" }
        "200": { $ref: "#/components/responses/TableOK" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
    delete:
      operationId: TableDelete
      summary: Delete a table.
      description: |
        Remove a table from the catalog. Its rows and index entries become
        unreachable; table IDs are never reused. A table that another table
        references through a foreign key cannot be deleted until the
        referencing table goes first (self-references do not count). On a
        schema-managed database this operation is always rejected.
      tags: [catalog]
      parameters:
        - { $ref: "#/components/parameters/TableName" }
      responses:
        default: { $ref: "#/components/responses/InternalServerError" }
        "204": { $ref: "#/components/responses/NoContent" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /tables/{table}/columns:
    post:
      operationId: ColumnCreate
      summary: Create a column on a table.
      description: |
        Append a column. Because existing rows have no value for it, the
        column must be nullable or carry a literal default; generator
        defaults (`uuid()`, `now_ms()`) are rejected on new columns of
        existing tables since they would produce a different value on every
        read of an old row. On a schema-managed database this operation is
        always rejected.
      tags: [catalog]
      parameters:
        - { $ref: "#/components/parameters/TableName" }
      requestBody: { $ref: "#/components/requestBodies/ColumnCreate" }
      responses:
        default: { $ref: "#/components/responses/InternalServerError" }
        "200": { $ref: "#/components/responses/TableOK" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /tables/{table}/columns/{column}:
    patch:
      operationId: ColumnUpdate
      summary: Update a column.
      description: |
        Update a column's properties. The only updatable property today is
        `name`; changing a column's type or nullability is not supported. A
        name change rewrites every metadata reference to the column (primary
        key, indexes, foreign keys), and rows are keyed by column ID, so no
        data is touched. On a schema-managed database this operation is
        always rejected.
      tags: [catalog]
      parameters:
        - { $ref: "#/components/parameters/TableName" }
        - { $ref: "#/components/parameters/ColumnName" }
      requestBody: { $ref: "#/components/requestBodies/ColumnUpdate" }
      responses:
        default: { $ref: "#/components/responses/InternalServerError" }
        "200": { $ref: "#/components/responses/TableOK" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
    delete:
      operationId: ColumnDelete
      summary: Delete a column.
      description: |
        Remove a column. Stored values for it become unreachable. A column
        used by the primary key, an index, or a foreign key cannot be
        deleted — delete the index or foreign key holder first. On a
        schema-managed database this operation is always rejected.
      tags: [catalog]
      parameters:
        - { $ref: "#/components/parameters/TableName" }
        - { $ref: "#/components/parameters/ColumnName" }
      responses:
        default: { $ref: "#/components/responses/InternalServerError" }
        "200": { $ref: "#/components/responses/TableOK" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /tables/{table}/indexes:
    post:
      operationId: IndexCreate
      summary: Create an index on a table.
      description: |
        Register a secondary index and backfill entries for every existing
        row, atomically: the index never becomes visible without its
        entries. Backfilling a unique index over data that already contains
        duplicates fails with an `invalid` problem — retrying cannot succeed
        until the data changes — and the registration is rolled back with
        it. On a schema-managed database this operation is always rejected.
      tags: [catalog]
      parameters:
        - { $ref: "#/components/parameters/TableName" }
      requestBody: { $ref: "#/components/requestBodies/IndexCreate" }
      responses:
        default: { $ref: "#/components/responses/InternalServerError" }
        "200": { $ref: "#/components/responses/TableOK" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /tables/{table}/indexes/{index}:
    delete:
      operationId: IndexDelete
      summary: Delete an index.
      description: |
        Remove an index from the catalog. Its entries become unreachable;
        index IDs are never reused. Queries that would have used it fall
        back to other access paths. On a schema-managed database this
        operation is always rejected.
      tags: [catalog]
      parameters:
        - { $ref: "#/components/parameters/TableName" }
        - { $ref: "#/components/parameters/IndexName" }
      responses:
        default: { $ref: "#/components/responses/InternalServerError" }
        "200": { $ref: "#/components/responses/TableOK" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /migrate:
    post:
      operationId: SchemaMigrate
      summary: Reconcile the database with a schema.
      description: |
        Take a `schema.rad` source document, compute the difference against the
        database's current catalog, and apply whatever changes are needed to
        make them match. The response lists the steps that were applied, in
        order.

        Migration is idempotent. Submitting a schema that already matches the
        database applies nothing and returns an empty step list. Renames are
        driven by `renamed_from` hints in the schema so that renaming a column
        or table does not delete and recreate it.

        A schema that fails to parse or validate, or that requests an
        unsupported change (such as altering a column's type), is rejected with
        an `invalid` problem and the database is left untouched.
      tags: [schema]
      requestBody: { $ref: "#/components/requestBodies/SchemaMigrate" }
      responses:
        default: { $ref: "#/components/responses/InternalServerError" }
        "200": { $ref: "#/components/responses/SchemaMigrateOK" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /query:
    post:
      operationId: Query
      summary: Run a relation-graph query.
      description: |
        Execute a single-consumer relation tree encoded as named
        relation nodes — scans, filters,
        projections, joins, aggregates, ordering, slicing — plus a root
        selector. Relationships need no dedicated verb: a projection field
        whose expression is a cardinality crossing (`exists`, `first`,
        `scalar`, `array`) materialises a correlated sub-relation as a nested
        boolean, object, value, or array. Aggregation is the `aggregate`
        node, grouped or global, and rides this one operation.

        The result is one datum, shaped exactly as the root materialises:
        `many` yields an array of records, `first` a record or `null`,
        `exactly_one` a record (erroring unless exactly one row exists), and
        `scalar` a naked value or `null`.

        The tree is structurally validated before binding. Unknown fields,
        cyclic, dangling, shared, or unreachable node definitions are invalid.
        Binding then rejects unknown tables, columns, or scopes, type
        mismatches, and nondeterministic crossings (a `first` over an unordered
        multi-row relation). Root `scalar` additionally requires one column
        and a statically at-most-one relation.
      tags: [data]
      requestBody: { $ref: "#/components/requestBodies/Query" }
      responses:
        default: { $ref: "#/components/responses/InternalServerError" }
        "200": { $ref: "#/components/responses/QueryOK" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /create:
    post:
      operationId: RowCreate
      summary: Insert one row.
      description: |
        Insert a single row into a table. Columns left out of `values` fall back
        to their schema default, so generated defaults such as `uuid()` and
        `now_ms()` are filled in server side. The complete stored row, including
        any generated values, is returned.

        Inserting a row that would violate a unique constraint, or whose foreign
        key references a row that does not exist, fails with a `conflict`
        problem and nothing is written.
      tags: [data]
      requestBody: { $ref: "#/components/requestBodies/RowCreate" }
      responses:
        default: { $ref: "#/components/responses/InternalServerError" }
        "200": { $ref: "#/components/responses/RowCreateOK" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /update:
    post:
      operationId: RowUpdate
      summary: Update one row by primary key.
      description: |
        Update the row named by `key`. Columns in `set` are assigned new values;
        columns listed in `clear` are set to `null` (only nullable columns may
        be cleared). Columns mentioned in neither are left as they are.

        When the target row exists the updated record is returned with `found`
        set to `true`. When it does not exist, `found` is `false` and nothing is
        written. Violating a unique constraint fails with a `conflict` problem.
      tags: [data]
      requestBody: { $ref: "#/components/requestBodies/RowUpdate" }
      responses:
        default: { $ref: "#/components/responses/InternalServerError" }
        "200": { $ref: "#/components/responses/RowUpdateOK" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /delete:
    post:
      operationId: RowDelete
      summary: Delete one row by primary key.
      description: |
        Delete the row named by `key`. The response reports whether a row was
        actually removed through `found`. Deleting a row that does not exist is
        not an error and reports `found` as `false`.

        A delete that would leave a dangling foreign key reference is refused
        with a `conflict` problem, since Rad restricts rather than cascades.
      tags: [data]
      requestBody: { $ref: "#/components/requestBodies/RowDelete" }
      responses:
        default: { $ref: "#/components/responses/InternalServerError" }
        "200": { $ref: "#/components/responses/RowDeleteOK" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /tx:
    post:
      operationId: TransactionBegin
      summary: Open a transaction.
      description: |
        Start a server held serializable transaction and return an opaque
        transaction id. Subsequent reads and writes made under `/tx/{id}` see a
        consistent snapshot plus their own uncommitted writes, and are isolated
        from other transactions until committed.

        A transaction holds server side state, so it must be finished with
        either commit or rollback. An idle transaction is reaped automatically
        after roughly sixty seconds, after which its id is no longer valid.
      tags: [transactions]
      responses:
        default: { $ref: "#/components/responses/InternalServerError" }
        "200": { $ref: "#/components/responses/TransactionBeginOK" }

  /tx/{id}/query:
    post:
      operationId: TransactionQuery
      summary: Run a shaped read inside a transaction.
      description: |
        Behaves exactly like `Query`, but reads through the transaction's
        snapshot and sees the transaction's own uncommitted writes. Referencing
        an unknown or already finished transaction fails with a `not_found`
        problem.
      tags: [transactions]
      parameters:
        - { $ref: "#/components/parameters/TransactionID" }
      requestBody: { $ref: "#/components/requestBodies/Query" }
      responses:
        default: { $ref: "#/components/responses/InternalServerError" }
        "200": { $ref: "#/components/responses/QueryOK" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /tx/{id}/create:
    post:
      operationId: TransactionRowCreate
      summary: Insert one row inside a transaction.
      description: |
        Behaves exactly like `RowCreate`, but the write is staged in the
        transaction and only becomes visible to others on commit. Referencing an
        unknown or already finished transaction fails with a `not_found`
        problem.
      tags: [transactions]
      parameters:
        - { $ref: "#/components/parameters/TransactionID" }
      requestBody: { $ref: "#/components/requestBodies/RowCreate" }
      responses:
        default: { $ref: "#/components/responses/InternalServerError" }
        "200": { $ref: "#/components/responses/RowCreateOK" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /tx/{id}/update:
    post:
      operationId: TransactionRowUpdate
      summary: Update one row inside a transaction.
      description: |
        Behaves exactly like `RowUpdate`, but the write is staged in the
        transaction and only becomes visible to others on commit. Referencing an
        unknown or already finished transaction fails with a `not_found`
        problem.
      tags: [transactions]
      parameters:
        - { $ref: "#/components/parameters/TransactionID" }
      requestBody: { $ref: "#/components/requestBodies/RowUpdate" }
      responses:
        default: { $ref: "#/components/responses/InternalServerError" }
        "200": { $ref: "#/components/responses/RowUpdateOK" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /tx/{id}/delete:
    post:
      operationId: TransactionRowDelete
      summary: Delete one row inside a transaction.
      description: |
        Behaves exactly like `RowDelete`, but the delete is staged in the
        transaction and only becomes visible to others on commit. Referencing an
        unknown or already finished transaction fails with a `not_found`
        problem.
      tags: [transactions]
      parameters:
        - { $ref: "#/components/parameters/TransactionID" }
      requestBody: { $ref: "#/components/requestBodies/RowDelete" }
      responses:
        default: { $ref: "#/components/responses/InternalServerError" }
        "200": { $ref: "#/components/responses/RowDeleteOK" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /tx/{id}/commit:
    post:
      operationId: TransactionCommit
      summary: Commit a transaction.
      description: |
        Atomically apply every write staged in the transaction and release its
        server side state. On success the transaction id is spent and can no
        longer be used.

        If another transaction committed a conflicting change while this one was
        open, the commit fails with a `conflict` problem. The correct response
        is to open a fresh transaction and replay the work.
      tags: [transactions]
      parameters:
        - { $ref: "#/components/parameters/TransactionID" }
      responses:
        default: { $ref: "#/components/responses/InternalServerError" }
        "204": { $ref: "#/components/responses/NoContent" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /tx/{id}/rollback:
    post:
      operationId: TransactionRollback
      summary: Roll back a transaction.
      description: |
        Discard every write staged in the transaction and release its server
        side state. On success the transaction id is spent.

        Rolling back is safe to call defensively. A transaction that has already
        been committed or rolled back, or that has been reaped for being idle,
        is simply gone, so clients may treat a `not_found` here as success.
      tags: [transactions]
      parameters:
        - { $ref: "#/components/parameters/TransactionID" }
      responses:
        default: { $ref: "#/components/responses/InternalServerError" }
        "204": { $ref: "#/components/responses/NoContent" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  parameters:
    TransactionID:
      name: id
      in: path
      required: true
      description: The opaque id returned by `TransactionBegin`.
      schema:
        type: string

    TableName:
      name: table
      in: path
      required: true
      description: The table's current name.
      schema:
        type: string

    ColumnName:
      name: column
      in: path
      required: true
      description: The column's current name.
      schema:
        type: string

    IndexName:
      name: index
      in: path
      required: true
      description: The index's name.
      schema:
        type: string

  requestBodies:
    SchemaMigrate:
      content:
        application/json:
          schema: { $ref: "#/components/schemas/MigrateProps" }

    Query:
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Query" }

    TableCreate:
      content:
        application/json:
          schema: { $ref: "#/components/schemas/TableDef" }

    TableUpdate:
      content:
        application/json:
          schema: { $ref: "#/components/schemas/TableUpdateProps" }

    ColumnCreate:
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ColumnInfo" }

    ColumnUpdate:
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ColumnUpdateProps" }

    IndexCreate:
      content:
        application/json:
          schema: { $ref: "#/components/schemas/IndexInfo" }

    RowCreate:
      content:
        application/json:
          schema: { $ref: "#/components/schemas/RowCreateProps" }

    RowUpdate:
      content:
        application/json:
          schema: { $ref: "#/components/schemas/RowUpdateProps" }

    RowDelete:
      content:
        application/json:
          schema: { $ref: "#/components/schemas/RowDeleteProps" }

  responses:
    InternalServerError:
      description: Something went wrong inside the server that was not the caller's fault.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    BadRequest:
      description: The request body was malformed or could not be decoded.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: The addressed resource, such as a transaction, does not exist.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: The write lost an optimistic race or violated a constraint.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    UnprocessableEntity:
      description: The request was well formed but failed validation against the catalog.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NoContent:
      description: The operation succeeded and there is no body to return.

    GetHealthOK:
      description: The server is alive.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Health" }
    TableListOK:
      description: The current set of tables.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/TableList" }
    TableOK:
      description: The table's definition after the mutation was applied.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/TableInfo" }
    SchemaMigrateOK:
      description: The schema was reconciled and the applied steps are listed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/MigrateResult" }
    QueryOK:
      description: The rows, or the single folded record when aggregating.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/QueryResult" }
    RowCreateOK:
      description: The stored row, including any server generated values.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/RecordResult" }
    RowUpdateOK:
      description: The updated row if it existed, otherwise a not found marker.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/RecordResult" }
    RowDeleteOK:
      description: Whether a row was removed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/DeleteResult" }
    TransactionBeginOK:
      description: The new transaction's credentials.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/TransactionCredentials" }

  schemas:
    Problem:
      description: |
        An RFC 7807 Problem Details object. Every non 2xx response carries one.
        The `code` member mirrors the last segment of `type` so clients can
        branch on a stable string without parsing the URI.
      type: object
      required: [type, title, status, code]
      properties:
        type:
          description: A stable URN identifying the problem kind, for example `urn:rad:problem:conflict`.
          type: string
        title:
          description: A short, human readable summary of the problem kind.
          type: string
        status:
          description: The HTTP status code, repeated in the body for convenience.
          type: integer
        detail:
          description: A human readable explanation specific to this occurrence.
          type: string
        code:
          description: |
            The machine readable discriminator. One of `invalid` for a malformed
            or rejected request, `execution_failed` for a valid query that
            failed on the data it met (division by zero, a violated cardinality
            assertion), `not_found`, `conflict` for a lost optimistic race or
            constraint violation, or `internal`.
          type: string
          enum: [invalid, execution_failed, not_found, conflict, internal]

    Value:
      description: An arbitrary JSON value carried by the HTTP protocol.

    Record:
      description: |
        One result row as a JSON object keyed by output name. Beyond scalar
        attributes a record may carry nested relations: a `first` field is a
        nested object (or `null`), an `array` field an array of records, and
        a folded relation an object of scalars.
      type: object
      additionalProperties: true

    Cells:
      description: |
        A JSON object mapping column names to values. Used for the primary key,
        the values of a new row, and the assignments of an update.
      type: object
      additionalProperties: { $ref: "#/components/schemas/Value" }

    Query:
      description: |
        An arbitrary JSON object containing an LIR payload. The HTTP protocol
        deliberately does not describe the LIR contract; servers validate this
        raw body against the independent LIR JSON Schema.

    ColumnDefault:
      description: |
        A column default, applied when an insert omits the column: either a
        builtin generator named by `func` (`uuid` on text columns, `now_ms`
        on int64 columns) or a literal `value` of the column's type. Exactly
        one of the two is set.
      type: object
      properties:
        func:
          description: A builtin generator, `uuid` or `now_ms`.
          type: string
        value:
          description: A literal of the column's type.
          allOf:
            - $ref: "#/components/schemas/Value"

    ColumnInfo:
      description: One column of a table, as reported by introspection.
      type: object
      required: [name, type]
      properties:
        name:
          type: string
        type:
          description: The column's storage type, one of `text`, `int64`, `float64`, or `bool`.
          type: string
        nullable:
          type: boolean
        format:
          description: An optional semantic hint such as `uuid` or `unix_ms`.
          type: string
        default:
          $ref: "#/components/schemas/ColumnDefault"

    IndexInfo:
      description: One secondary index, in both definitions and introspection.
      type: object
      required: [name, columns]
      properties:
        name:
          type: string
        columns:
          description: The indexed column names, in order.
          type: array
          items:
            type: string
        unique:
          type: boolean

    ForeignKeyInfo:
      description: |
        One foreign key, in both definitions and introspection. The
        referenced columns must be the referenced table's full primary key.
      type: object
      required: [name, columns, ref_table, ref_columns]
      properties:
        name:
          type: string
        columns:
          description: The referencing column names on this table.
          type: array
          items:
            type: string
        ref_table:
          description: The referenced table's name.
          type: string
        ref_columns:
          description: The referenced table's primary key columns, in order.
          type: array
          items:
            type: string

    TableInfo:
      description: One table's definition, as reported by introspection.
      type: object
      required: [name, columns, primary_key]
      properties:
        name:
          type: string
        columns:
          type: array
          items: { $ref: "#/components/schemas/ColumnInfo" }
        primary_key:
          description: The column names that make up the primary key, in order.
          type: array
          items:
            type: string
        indexes:
          type: array
          items: { $ref: "#/components/schemas/IndexInfo" }
        foreign_keys:
          type: array
          items: { $ref: "#/components/schemas/ForeignKeyInfo" }

    TableDef:
      description: |
        A new table's definition: exactly what a `schema.rad` entry
        expresses, as JSON. Column types are `text`, `int64`, `float64`, or
        `bool`; the primary key is required and its columns must not be
        nullable.
      type: object
      required: [name, columns, primary_key]
      properties:
        name:
          type: string
        columns:
          type: array
          items: { $ref: "#/components/schemas/ColumnInfo" }
        primary_key:
          type: array
          items:
            type: string
        indexes:
          type: array
          items: { $ref: "#/components/schemas/IndexInfo" }
        foreign_keys:
          type: array
          items: { $ref: "#/components/schemas/ForeignKeyInfo" }

    Health:
      description: The liveness status of the server.
      type: object
      required: [status, mode]
      properties:
        status:
          type: string
        mode:
          description: |
            The database's catalog management mode: `direct` (the catalog
            is mutable over this API) or `schema` (schema.rad migrations own
            the catalog and the imperative catalog operations are rejected).
          type: string

    TableList:
      description: The set of tables defined in the database.
      type: object
      required: [tables]
      properties:
        tables:
          type: array
          items: { $ref: "#/components/schemas/TableInfo" }

    MigrateProps:
      description: A request to reconcile the database with a schema.
      type: object
      required: [schema]
      properties:
        schema:
          description: The full `schema.rad` source document, as YAML.
          type: string

    MigrateResult:
      description: The outcome of a migration.
      type: object
      required: [steps]
      properties:
        steps:
          description: |
            A human readable description of each change that was applied, in the
            order it was applied. Empty when the database already matched.
          type: array
          items:
            type: string

    QueryResult:
      description: |
        The result of a query: one datum, shaped exactly as the root
        materialises. A `many` root is an array of records; `first` is a
        record or `null`; `exactly_one` is a record; `scalar` is a naked
        value or `null`. Nested `first` fields are objects (or `null`) and
        nested `array` fields are arrays, recursively.
      type: object
      required: [result]
      properties:
        result:
          allOf:
            - $ref: "#/components/schemas/Value"

    TableUpdateProps:
      description: The table properties to update.
      type: object
      required: [name]
      properties:
        name:
          description: The table's new name.
          type: string

    ColumnUpdateProps:
      description: The column properties to update.
      type: object
      required: [name]
      properties:
        name:
          description: The column's new name.
          type: string

    RowCreateProps:
      description: A request to insert one row.
      type: object
      required: [table, values]
      properties:
        table:
          type: string
        values:
          description: |
            The column values for the new row. Columns left out fall back to
            their schema default.
          allOf:
            - $ref: "#/components/schemas/Cells"

    RowUpdateProps:
      description: A request to update one row by primary key.
      type: object
      required: [table, key, set]
      properties:
        table:
          type: string
        key:
          description: The primary key of the row to update.
          allOf:
            - $ref: "#/components/schemas/Cells"
        set:
          description: The columns to assign new values.
          allOf:
            - $ref: "#/components/schemas/Cells"
        clear:
          description: |
            Nullable columns to set to `null`. A column may appear in `set` or
            `clear` but assigning and clearing the same column is redundant.
          type: array
          items:
            type: string

    RowDeleteProps:
      description: A request to delete one row by primary key.
      type: object
      required: [table, key]
      properties:
        table:
          type: string
        key:
          description: The primary key of the row to delete.
          allOf:
            - $ref: "#/components/schemas/Cells"

    RecordResult:
      description: |
        A single row lookup or write result. When the addressed row exists,
        `found` is `true` and `record` carries it. When it does not, `found` is
        `false` and `record` is absent.
      type: object
      required: [found]
      properties:
        found:
          type: boolean
        record:
          $ref: "#/components/schemas/Record"

    DeleteResult:
      description: The result of a delete.
      type: object
      required: [found]
      properties:
        found:
          description: Whether a row was actually removed.
          type: boolean

    TransactionCredentials:
      description: The handle for a newly opened transaction.
      type: object
      required: [id]
      properties:
        id:
          description: The opaque id used to address the transaction under `/tx/{id}`.
          type: string
