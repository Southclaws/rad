apiVersion: radengine.dev/v1alpha1
kind: Database
metadata:
  name: example
spec:
  storage:
    bucket: example-rad
    prefix: rad
    region: us-east-1
    authentication:
      credentialsSecretRef:
        name: example-rad-s3
  catalogMode: schema
  readers: 2
  logging:
    level: info
    format: json
    programs: false
  telemetry:
    diagnostics: summary
    metrics: true
    traceSamplePercent: 1
  relationCache:
    sizeMiB: 128
    entries: 4096
    maxResultSizeMiB: 8
  slate:
    decodedCacheSizeMiB: 128
    scanCacheBlocks: false
  route:
    hostname: example.radengine.dev
    scheme: https
  deletionPolicy: Retain
  terminationGracePeriodSeconds: 120
