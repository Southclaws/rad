---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: databases.radengine.dev
spec:
  group: radengine.dev
  names:
    kind: Database
    listKind: DatabaseList
    plural: databases
    shortNames:
    - rad
    singular: database
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .status.url
      name: URL
      type: string
    - jsonPath: .spec.storage.bucket
      name: Bucket
      type: string
    - jsonPath: .status.readyReaders
      name: Readers
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              DatabaseSpec is the desired state for one Rad process and one physical S3
              bucket.
            properties:
              captureWorkloadCorpus:
                default: false
                description: |-
                  CaptureWorkloadCorpus records canonical programs with literal values for
                  bounded offline replay. The writer and each reader apply the same policy.
                type: boolean
              catalogMode:
                default: schema
                description: CatalogMode is immutable after the database is initialized.
                enum:
                - direct
                - schema
                type: string
                x-kubernetes-validations:
                - message: catalogMode is immutable
                  rule: self == oldSelf
              deletionPolicy:
                default: Retain
                description: |-
                  DeletionPolicy is Retain in v1alpha1: deleting the CRD never deletes S3
                  objects or the bucket.
                enum:
                - Retain
                type: string
              internalTLS:
                default:
                  mode: auto
                description: |-
                  InternalTLS secures the reader-to-writer statistics channel. It has no
                  effect while no readers exist, because the channel does not exist.
                properties:
                  issuerRef:
                    description: |-
                      IssuerRef delegates issuance to an existing cert-manager issuer instead
                      of the per-database authority the operator would otherwise create.
                    properties:
                      group:
                        default: cert-manager.io
                        type: string
                      kind:
                        default: Issuer
                        enum:
                        - Issuer
                        - ClusterIssuer
                        type: string
                      name:
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                  mode:
                    default: auto
                    description: InternalTLSMode selects how the instance-to-instance
                      channel is secured.
                    enum:
                    - auto
                    - required
                    - disabled
                    type: string
                  secretName:
                    description: |-
                      SecretName is a kubernetes.io/tls Secret holding tls.crt, tls.key, and
                      ca.crt. The operator validates it but never owns or modifies it.
                    type: string
                type: object
                x-kubernetes-validations:
                - message: secretName and issuerRef are mutually exclusive
                  rule: '!(has(self.secretName) && has(self.issuerRef))'
                - message: disabled internal TLS cannot also name a certificate source
                  rule: '!(self.mode == ''disabled'' && (has(self.secretName) || has(self.issuerRef)))'
              logging:
                default:
                  format: json
                  level: info
                  programs: false
                description: Logging applies the same event policy to the writer and
                  all readers.
                properties:
                  format:
                    default: json
                    description: LogFormat selects the standard error event projection.
                    enum:
                    - text
                    - json
                    - logfmt
                    type: string
                  level:
                    default: info
                    description: LogLevel selects the minimum operational event severity.
                    enum:
                    - error
                    - warn
                    - info
                    - debug
                    type: string
                  programs:
                    default: false
                    type: boolean
                type: object
              readers:
                default: 0
                description: |-
                  Readers is the number of read-only Rad instances. A Rad instance holds no
                  data: every instance reads the same S3 objects, so a reader adds read
                  capacity rather than a copy of the database. Readers are addressable
                  through their own Service; the published route always reaches the writer,
                  because a client that reads immediately after writing would otherwise
                  observe reader lag.
                format: int32
                maximum: 32
                minimum: 0
                type: integer
              resources:
                description: |-
                  Resources applies to every Rad container, writer and reader alike. Empty
                  resources use the controller's conservative defaults.
                properties:
                  claims:
                    description: |-
                      Claims lists the names of resources, defined in spec.resourceClaims,
                      that are used by this container.

                      This field depends on the
                      DynamicResourceAllocation feature gate.

                      This field is immutable. It can only be set for containers.
                    items:
                      description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                      properties:
                        name:
                          description: |-
                            Name must match the name of one entry in pod.spec.resourceClaims of
                            the Pod where this field is used. It makes that resource available
                            inside a container.
                          type: string
                        request:
                          description: |-
                            Request is the name chosen for a request in the referenced claim.
                            If empty, everything from the claim is made available, otherwise
                            only the result of this request.
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  limits:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Limits describes the maximum amount of compute resources allowed.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                  requests:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Requests describes the minimum amount of compute resources required.
                      If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                      otherwise to an implementation-defined value. Requests cannot exceed Limits.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                type: object
              route:
                description: |-
                  Route describes the tenant hostname published through the cluster's
                  shared ingress implementation.
                properties:
                  hostname:
                    description: Hostname is matched without modifying Rad's root-relative
                      HTTP API.
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                  scheme:
                    default: https
                    description: |-
                      Scheme is the externally advertised URL scheme. Traffic from the Ingress
                      to Rad remains HTTP.
                    enum:
                    - http
                    - https
                    type: string
                  tlsSecretName:
                    description: |-
                      TLSSecretName enables Ingress TLS with a Secret in the database namespace.
                      It may be omitted when TLS terminates before the cluster Ingress.
                    type: string
                required:
                - hostname
                type: object
                x-kubernetes-validations:
                - message: tlsSecretName requires scheme https
                  rule: '!has(self.tlsSecretName) || self.scheme == ''https'''
              slate:
                description: Slate applies the same storage settings to all pods.
                properties:
                  bloomBitsPerKey:
                    default: 10
                    format: int32
                    minimum: 1
                    type: integer
                  decodedCacheSizeMiB:
                    default: 128
                    format: int32
                    minimum: 16
                    type: integer
                  flushIntervalMilliseconds:
                    default: 100
                    format: int32
                    minimum: 1
                    type: integer
                  l0FlushParallelism:
                    default: 4
                    format: int32
                    minimum: 1
                    type: integer
                  l0MaxSSTs:
                    default: 8
                    format: int32
                    minimum: 1
                    type: integer
                  l0MaxSSTsPerKey:
                    default: 8
                    format: int32
                    minimum: 1
                    type: integer
                  l0SSTSizeMiB:
                    default: 64
                    format: int32
                    minimum: 1
                    type: integer
                  maxUnflushedMiB:
                    default: 1024
                    format: int32
                    minimum: 1
                    type: integer
                  maxWALFlushesBeforeL0Flush:
                    default: 4096
                    format: int64
                    minimum: 1
                    type: integer
                  minFilterKeys:
                    default: 1000
                    format: int32
                    minimum: 1
                    type: integer
                  objectCache:
                    description: SlateObjectCache configures the local raw object
                      cache for each database pod.
                    properties:
                      cacheOnCompaction:
                        default: false
                        type: boolean
                      cacheOnFlush:
                        default: false
                        type: boolean
                      enabled:
                        default: false
                        description: Enabled creates an ephemeral cache directory
                          for each pod.
                        type: boolean
                      partSizeKiB:
                        default: 4096
                        format: int32
                        minimum: 1
                        type: integer
                      preload:
                        default: none
                        enum:
                        - none
                        - l0
                        - all
                        type: string
                      sizeMiB:
                        default: 16384
                        format: int32
                        minimum: 1
                        type: integer
                    type: object
                  scanCacheBlocks:
                    default: false
                    type: boolean
                  scanMaxFetchTasks:
                    default: 4
                    format: int32
                    minimum: 1
                    type: integer
                  scanReadAheadKiB:
                    default: 256
                    format: int32
                    minimum: 1
                    type: integer
                  sstBlockSizeKiB:
                    default: 4
                    enum:
                    - 1
                    - 2
                    - 4
                    - 8
                    - 16
                    - 32
                    - 64
                    format: int32
                    type: integer
                type: object
                x-kubernetes-validations:
                - message: l0MaxSSTsPerKey must not exceed l0MaxSSTs
                  rule: self.l0MaxSSTsPerKey <= self.l0MaxSSTs
                - message: maxUnflushedMiB must be at least l0SSTSizeMiB
                  rule: self.maxUnflushedMiB >= self.l0SSTSizeMiB
              storage:
                description: |-
                  The physical storage fields are immutable, while authentication may be
                  rotated or migrated between supported identity mechanisms.
                properties:
                  authentication:
                    description: |-
                      S3Authentication selects one credential source. A Secret contains AWS SDK
                      environment variable names; a ServiceAccount enables provider-native
                      workload identity such as AssumeRoleWithWebIdentity.
                    properties:
                      credentialsSecretRef:
                        description: |-
                          CredentialsSecretRef names a Secret in the Database namespace. It must
                          contain AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY and may contain
                          AWS_SESSION_TOKEN.
                        properties:
                          name:
                            default: ""
                            description: |-
                              Name of the referent.
                              This field is effectively required, but due to backwards compatibility is
                              allowed to be empty. Instances of this type with an empty value here are
                              almost certainly wrong.
                              More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                            type: string
                        type: object
                        x-kubernetes-map-type: atomic
                      serviceAccountName:
                        description: |-
                          ServiceAccountName names an existing ServiceAccount in the Database
                          namespace configured for provider-native workload identity.
                        type: string
                    type: object
                    x-kubernetes-validations:
                    - message: exactly one of credentialsSecretRef or serviceAccountName
                        is required
                      rule: has(self.credentialsSecretRef) != has(self.serviceAccountName)
                    - message: credentialsSecretRef.name must not be empty
                      rule: '!has(self.credentialsSecretRef) || size(self.credentialsSecretRef.name)
                        > 0'
                    - message: serviceAccountName must not be empty
                      rule: '!has(self.serviceAccountName) || size(self.serviceAccountName)
                        > 0'
                  bucket:
                    minLength: 1
                    type: string
                  endpoint:
                    description: Endpoint selects an S3-compatible service such as
                      RustFS. Omit it for AWS.
                    pattern: ^$|^https?://
                    type: string
                  prefix:
                    default: rad
                    description: Prefix is the SlateDB object prefix within the bucket.
                    minLength: 1
                    type: string
                  region:
                    default: us-east-1
                    description: Region is passed to the S3 client.
                    minLength: 1
                    type: string
                required:
                - authentication
                - bucket
                type: object
                x-kubernetes-validations:
                - message: storage location is immutable
                  rule: self.bucket == oldSelf.bucket && self.prefix == oldSelf.prefix
                    && self.region == oldSelf.region && ((!has(self.endpoint) && !has(oldSelf.endpoint))
                    || (has(self.endpoint) && has(oldSelf.endpoint) && self.endpoint
                    == oldSelf.endpoint))
              telemetry:
                default:
                  diagnostics: summary
                  metrics: true
                description: Telemetry applies the same export and diagnostic policy
                  to all pods.
                properties:
                  diagnostics:
                    default: summary
                    description: Diagnostics limits the level that an HTTP request
                      can select.
                    enum:
                    - "off"
                    - summary
                    - detailed
                    - full
                    type: string
                  endpoint:
                    description: Endpoint is the base OTLP HTTP endpoint. An empty
                      value disables export.
                    pattern: ^$|^https?://
                    type: string
                  metrics:
                    default: true
                    description: Metrics enables OTEL metric export and the metrics
                      HTTP route.
                    type: boolean
                type: object
              terminationGracePeriodSeconds:
                default: 120
                description: |-
                  TerminationGracePeriodSeconds bounds graceful Rad shutdown before
                  Kubernetes forcefully terminates the writer.
                format: int64
                maximum: 3600
                minimum: 30
                type: integer
            required:
            - route
            - storage
            type: object
          status:
            description: |-
              DatabaseStatus is the controller-observed state. Kubernetes resources are
              derived and may be reconstructed from spec after a controller restart.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              desiredImage:
                type: string
              desiredReaders:
                format: int32
                type: integer
              internalTransport:
                description: |-
                  InternalTransport describes how readers reach the writer, so an operator
                  can see whether the channel is encrypted without inspecting pods.
                properties:
                  certificateSecret:
                    description: CertificateSecret holds the serving certificate,
                      when there is one.
                    type: string
                  mode:
                    description: Mode is tls or plaintext.
                    type: string
                  provider:
                    description: 'Provider names what issued the certificate: cert-manager,
                      user, or none.'
                    type: string
                  writerAddress:
                    description: WriterAddress is the URL readers are configured to
                      report to.
                    type: string
                type: object
              observedGeneration:
                format: int64
                type: integer
              observedImage:
                type: string
              readerServiceName:
                description: ReaderServiceName is empty while no readers are requested.
                type: string
              readyReaders:
                format: int32
                type: integer
              readyReplicas:
                format: int32
                type: integer
              serviceName:
                type: string
              statefulSetName:
                type: string
              url:
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
