version: "3"

tasks:
  default:
    silent: true
    cmds:
      - task --list-all

  build:
    desc: Build the Rad release binary
    cmds:
      - cargo build --locked --release {{.CLI_ARGS}}

  install:
    desc: Install the Rad binary from this checkout
    cmds:
      - cargo install --locked --path . {{.CLI_ARGS}}

  serve:
    desc: Run Rad using RAD_ADDR and RAD_STORAGE configuration
    cmds:
      - cargo run --locked -- serve {{.CLI_ARGS}}

  demo:
    desc: Run a fresh Rad server and the tracker demo end to end
    cmds:
      - go run ./examples/demo --local

  up:
    desc: Run the tracker demo, then keep its Rad server available
    cmds:
      - go run ./examples/demo --local --stay

  test:
    desc: Run the complete Rad test suite
    cmds:
      - cargo test --locked --all-targets {{.CLI_ARGS}}

  test:differential:
    desc: Run shared conformance fixtures through the production and reference executors
    cmds:
      - cargo test --locked --test differential_corpus {{.CLI_ARGS}}

  test:generative:
    desc: Run generated LIR/PIR four-way differentials, state models, and metamorphic checks
    cmds:
      - cargo test --locked --test generative_differential {{.CLI_ARGS}}

  test:fuzz:smoke:
    desc: Run a bounded smoke pass over every coverage-guided fuzz target
    cmds:
      - cargo +nightly-2026-07-20 fuzz run protocol_lir -- -runs=256 {{.CLI_ARGS}}
      - cargo +nightly-2026-07-20 fuzz run protocol_pir -- -runs=256 {{.CLI_ARGS}}
      - cargo +nightly-2026-07-20 fuzz run schema -- -runs=256 {{.CLI_ARGS}}
      - cargo +nightly-2026-07-20 fuzz run ordered_tuple -- -runs=256 {{.CLI_ARGS}}
      - cargo +nightly-2026-07-20 fuzz run row_codec -- -runs=256 {{.CLI_ARGS}}

  test:http:
    desc: Run the outside-in OpenAPI/Axum adapter tests
    cmds:
      - cargo test --locked http::tests {{.CLI_ARGS}}

  test:dst:
    desc: Run deterministic schema scheduling and crash-boundary simulations
    cmds:
      - cargo test --locked --test schema_scheduler_simulation {{.CLI_ARGS}}

  test:dst:determinism:
    desc: Prove byte-identical same-seed DST replay on Linux or macOS
    env:
      RUSTFLAGS: --cfg tokio_unstable
    cmds:
      - cargo test --locked --test schema_scheduler_determinism identical_seed_and_boundary_produce_identical_traces -- --exact --ignored --nocapture {{.CLI_ARGS}}

  test:dst:soak:
    desc: Run the ignored schema DST soak; configure RAD_DST_SECONDS or RAD_DST_SEEDS
    cmds:
      - cargo test --locked --test schema_scheduler_simulation turmoil_schema_work_soak -- --exact --ignored --nocapture {{.CLI_ARGS}}

  test:dst:replay:
    desc: Replay one DST failure using RAD_DST_SEED, RAD_DST_SCENARIO and RAD_DST_BOUNDARY
    cmds:
      - cargo test --locked --test schema_scheduler_simulation turmoil_schema_work_replay -- --exact --ignored --nocapture {{.CLI_ARGS}}

  test:storage:
    desc: Run Docker-free storage qualification, crash recovery, and simulation
    cmds:
      - cargo test --locked --test kv_backend_qualification --test storage_crash_recovery --test storage_fault_campaign --test storage_simulation --test storage_network_faults {{.CLI_ARGS}}

  test:storage:rustfs:
    desc: Run qualification, process-death, network-fault, and latency suites against RustFS
    cmds:
      - cargo test --locked --test kv_backend_qualification rustfs_backend_satisfies_the_storage_qualification_suite -- --exact --ignored --nocapture {{.CLI_ARGS}}
      - cargo test --locked --test storage_crash_recovery rustfs_backend_recovers_from_real_process_death -- --exact --ignored --nocapture {{.CLI_ARGS}}
      - cargo test --locked --test storage_network_faults rustfs_network_fault_matrix_preserves_commit_and_writer_safety -- --exact --ignored --nocapture {{.CLI_ARGS}}
      - cargo test --locked --test s3_latency seeded_s3_latency_preserves_http_write_reopen_and_query_correctness -- --exact --ignored --nocapture {{.CLI_ARGS}}

  benchmark:s3:
    desc: Run the stable outside-in S3 benchmarks against RustFS in release mode
    cmds:
      - cargo test --release --locked --test s3_http_benchmark -- --ignored --nocapture --test-threads=1 {{.CLI_ARGS}}

  generate:http:
    desc: Regenerate server and Go client HTTP bindings from the normative OpenAPI specification
    cmds:
      - openapi-to-rust generate --config openapi-to-rust.toml
      - go generate ./clients/go/api
      - go run ./tools/openapidoc -input api/openapi.yaml -output home/content/docs/reference/http-api.mdx

  generate:admin:
    desc: Regenerate the admin UI assets embedded in the Rad binary
    cmds:
      - npm --prefix admin ci
      - npm --prefix admin run build

  generate:cli:
    desc: Regenerate the Clap command surface and CLI documentation from OpenCLI
    cmds:
      - opencli generate rust-clap opencli.yaml --output src/cli --module generated
      - go run ./tools/clidoc -input opencli.yaml -output home/content/docs/cli.mdx

  generate:protocol:
    desc: Regenerate Rust and Go LIR/PIR bindings from the normative schemas
    cmds:
      - go run ./tools/schemagen -yaml protocol/lir.schema.yaml -json clients/go/protocol/lir.schema.json -web home/public/schema/lir.json
      - go run ./tools/schemagen -yaml protocol/pir.schema.yaml -json clients/go/protocol/pir.schema.json -web home/public/schema/pir.json
      - schemancer protocol/lir.schema.yaml rust src/protocol/generated --rust-filename lir.rs --config protocol/schemancer.yaml
      - schemancer protocol/pir.schema.yaml rust src/protocol/generated --rust-filename pir.rs --config protocol/schemancer.yaml
      - schemancer protocol/lir.schema.yaml golang clients/go/protocol/lirwire --package lirwire --config protocol/schemancer.yaml
      - schemancer protocol/pir.schema.yaml golang clients/go/protocol/pirwire --package pirwire --config protocol/schemancer.yaml
      - go run ./tools/jsonschemadoc -input protocol/lir.schema.yaml -profile lir -output home/content/docs/reference/lir-schema.mdx
      - go run ./tools/jsonschemadoc -input protocol/pir.schema.yaml -profile pir -output home/content/docs/reference/pir-schema.mdx

  generate:docs:
    desc: Regenerate CLI, HTTP, LIR, and PIR documentation from their normative specifications
    cmds:
      - go run ./tools/clidoc -input opencli.yaml -output home/content/docs/cli.mdx
      - go run ./tools/openapidoc -input api/openapi.yaml -output home/content/docs/reference/http-api.mdx
      - go run ./tools/jsonschemadoc -input protocol/lir.schema.yaml -profile lir -output home/content/docs/reference/lir-schema.mdx
      - go run ./tools/jsonschemadoc -input protocol/pir.schema.yaml -profile pir -output home/content/docs/reference/pir-schema.mdx

  check:http:
    desc: Check HTTP bindings for OpenAPI generation drift
    cmds:
      - openapi-to-rust generate --config openapi-to-rust.toml --check

  install:codegen:
    desc: Install the exact generators used by Rad
    cmds:
      - go install github.com/Southclaws/schemancer@dce16f80a18feb5578e70f669e7bb0a8d2314d36
      - go install github.com/opencli-dev/opencli/tools/opencli@5aac59dcf3018ccd0b0506b49c3b880ee01ba81e
      - cargo install --force --locked --version '=0.12.0' openapi-to-rust

  check:codegen:
    desc: Check CLI, LIR, PIR, and HTTP bindings for generator drift
    cmds:
      - task: generate:protocol
      - task: generate:cli
      - task: generate:docs
      - task: check:http
      - git diff --exit-code -- src/protocol/generated clients/go/protocol/lir.schema.json clients/go/protocol/pir.schema.json clients/go/protocol/lirwire/lirwire.go clients/go/protocol/pirwire/pirwire.go home/public/schema/lir.json home/public/schema/pir.json src/cli/generated.rs home/content/docs/cli.mdx home/content/docs/reference/http-api.mdx home/content/docs/reference/lir-schema.mdx home/content/docs/reference/pir-schema.mdx src/http/generated
