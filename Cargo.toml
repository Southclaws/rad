[workspace]
members = ["tools/keyform"]
exclude = ["fuzz"]

[package]
name = "rad"
version = "0.1.0"
edition = "2024"

[features]
dst-determinism = []

[[test]]
name = "schema_scheduler_determinism"
path = "tests/schema_scheduler_determinism.rs"
required-features = ["dst-determinism"]

[lints.rust]
# deny, not forbid: forbid cannot be relaxed by an attribute, and the test
# harness carries one sanctioned `unsafe` block (Windows console signal
# delivery). Every other unsafe block remains an error.
unsafe_code = "deny"

[lints.clippy]
large_futures = "warn"
significant_drop_in_scrutinee = "warn"
unused_self = "warn"
zero_sized_map_values = "warn"

[dependencies]
async-trait = "0.1.88"
async-recursion = "1.1.1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
base64 = "0.22.1"
bytes = "1.10.1"
casefold = "0.1.0"
chrono = { version = "0.4.41", features = ["serde"] }
clap = { version = "4.6", features = ["derive", "env"] }
cliclack = "0.5.5"
futures = "0.3.31"
http-body-util = "0.1"
hyper = { version = "1.11", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["server", "tokio"] }
jsonschema = { version = "0.49", default-features = false }
mime = "0.3"
minijinja = { version = "2.21.0", default-features = false, features = ["builtins", "macros", "multi_template", "serde"] }
num-bigint = "0.4.6"
opentelemetry = { version = "0.32.0", default-features = false, features = ["metrics", "trace"] }
opentelemetry-otlp = { version = "0.32.0", default-features = false, features = ["http-proto", "metrics", "reqwest-blocking-client", "reqwest-rustls", "trace"] }
opentelemetry-prometheus = "0.32.0"
opentelemetry_sdk = { version = "0.32.1", default-features = false, features = ["metrics", "rt-tokio", "trace"] }
pgwire = { version = "0.40.5", default-features = false, features = ["pg-type-chrono", "server-api"] }
prometheus = { version = "0.14.0", default-features = false }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1.0.140", features = ["raw_value"] }
serde_urlencoded = "0.7"
serde_yaml = "0.9.34"
sha2 = "0.10.9"
sqlparser = "0.62.0"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
slatedb = { version = "=0.15.0", default-features = false, features = ["aws", "foyer"] }
slatedb-common = "=0.15.0"
thiserror = "2.0.12"
tempfile = "3.20.0"
tokio = { version = "1.46.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = { version = "0.1.44", features = ["max_level_debug", "release_max_level_debug"] }
tracing-logfmt = "0.3.7"
tracing-opentelemetry = { version = "0.33.0", default-features = false }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json", "time"] }
url = "2"
uuid = { version = "1.17.0", features = ["v4"] }

[dev-dependencies]
rcgen = "0.14"
rusty-s3 = { version = "0.10.1", default-features = false, features = ["rustcrypto"] }
testcontainers = "0.27.3"
tokio-postgres = "0.7.15"
tower = { version = "0.5", features = ["util"] }
turmoil = "0.7.2"

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dev-dependencies]
fastrand = "2.3.0"
mad-turmoil = { git = "https://github.com/s2-streamstore/mad-turmoil.git", rev = "f2dc7556f60497dacb54dfb23c00af7eac487069" }
rand = "0.10.0"
