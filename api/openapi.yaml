openapi: 3.0.3

info:
  contact:
    name: Barnaby Keene
  description: >
    The Rad wire protocol: a small JSON over HTTP surface that clients and a
    Rad server speak to each other.


    Rad is reached over a `rad://` (or `rads://` for HTTPS) connection URI
    which resolves to an HTTP base URL. Rad speaks plain HTTP; front it with
    your own proxy for encryption or authentication and use `rads://` so the
    client dials it over HTTPS. Rad never terminates TLS itself. The default
    port is 7237.


    This document is the contract. Every operation describes what it does, what
    it returns, and how it fails, in enough detail to serve as the basis for
    acceptance tests. The protocol is deliberately unversioned: Rad is a proof
    of concept and makes no backwards compatibility guarantees yet.


    Errors are returned as RFC 7807 Problem Details with the
    `application/problem+json` media type. The `code` member is the stable,
    machine readable discriminator (`invalid`, `not_found`, `conflict`,
    `internal`) and clients should switch on it rather than parsing the `type`
    URI or the HTTP status.
  title: rad
  version: "v0"

servers:
  - url: "/"
    description: >
      The server mounts every operation at the root. A `rad://host:7237`
      connection URI maps directly onto `http://host:7237/`.

tags:
  - name: meta
    description: Liveness and schema introspection.
  - name: probes
    description: >
      Process probes for orchestrators such as Kubernetes. They describe the
      serving process rather than the database's contents, never mutate catalog
      or application data, and are answerable before the database itself is
      available. An orchestrator decides from the HTTP status alone.
  - name: schema
    description: Reconciling the database with a rad.schema.yaml file.
  - name: administration
    description: Inspecting and controlling durable database maintenance work.
  - name: catalog
    description: >
      Imperative catalog mutation: creating, updating, and deleting tables,
      columns, and indexes over the API. Available only on directly managed
      databases; a schema-managed database rejects every operation in this
      group with an `invalid` problem, since its catalog is owned by
      `rad.schema.yaml` migrations.
  - name: data
    description: Reading and writing rows against committed state.
  - name: transactions
    description: Server held serializable transactions.

paths:
  /info:
    get:
      operationId: GetInfo
      summary: Describe this database.
      description: |
        Return stable metadata for the database behind this endpoint. `mode`
        tells management tools whether catalog changes are available directly
        through the API or are owned by `rad.schema.yaml` migrations.
        `schema_version` identifies the latest committed catalog state, and
        `schema_version_at` reports when that version committed. `location` is
        the server's configured storage location and is intended for local
        development and administrative tooling.
      tags: [meta]
      responses:
        default: { $ref: "#/components/responses/InternalServerError" }
        "200": { $ref: "#/components/responses/GetInfoOK" }

  /healthz:
    get:
      operationId: GetHealthz
      summary: Check that the server is alive.
      description: |
        A cheap check that touches no storage. It always returns `200` with a
        small status body while the process is serving, so it is safe to use as
        a `rad://` reachability test before opening a connection. It is database
        metadata, not an orchestrator signal: use `/readyz` and `/livez` for
        those.
      tags: [meta]
      responses:
        default: { $ref: "#/components/responses/InternalServerError" }
        "200": { $ref: "#/components/responses/GetHealthzOK" }

  /startupz:
    get:
      operationId: GetStartupz
      summary: Report whether the database finished starting.
      description: |
        Succeed once storage is open, the catalog's identity and mode are
        validated, and the required background workers are running. Until then
        the process answers the probe endpoints and nothing else, so an
        orchestrator can bound initial storage startup without restarting a
        process that is still opening a slow object store, and no client reaches
        a partially initialized database.

        A storage preflight monitors the object store while startup is held.
        The preflight sets the reason to show the cause of the hold. On
        success, the reason is `started`. While startup is held, the reason is
        `starting`, `storage_bucket_missing`, `storage_unauthorized`, or
        `storage_unreachable`.
      tags: [probes]
      responses:
        default: { $ref: "#/components/responses/InternalServerError" }
        "200": { $ref: "#/components/responses/ProbePassed" }
        "503": { $ref: "#/components/responses/ProbeFailed" }

  /readyz:
    get:
      operationId: GetReadyz
      summary: Report whether the database can accept traffic.
      description: |
        Succeed only while the process can serve the read or write access it was
        started with. It fails as soon as shutdown begins, as soon as the writer
        is fenced, and while storage is failing or has not been observed within
        the freshness window. A background task refreshes that observation, so
        answering the probe never issues a new object-store request.

        The reason is `starting`, `serving`, `draining`, `fenced`,
        `storage_unavailable`, or `storage_stale`.
      tags: [probes]
      responses:
        default: { $ref: "#/components/responses/InternalServerError" }
        "200": { $ref: "#/components/responses/ProbePassed" }
        "503": { $ref: "#/components/responses/ProbeFailed" }

  /livez:
    get:
      operationId: GetLivez
      summary: Report whether the process and its critical tasks run.
      description: |
        Succeed while the process serves requests and every critical background
        task is alive. Storage never fails this probe: a temporary object-store
        or network outage must withdraw traffic through `/readyz` rather than
        restart a process that would come back to the same outage.

        The reason is `live`, `draining`, or `task_failed`.
      tags: [probes]
      responses:
        default: { $ref: "#/components/responses/InternalServerError" }
        "200": { $ref: "#/components/responses/ProbePassed" }
        "503": { $ref: "#/components/responses/ProbeFailed" }

  /statistics:
    get:
      operationId: GetStatistics
      summary: Return the query-planner statistics this instance holds.
      description: |
        Return the distilled model repository the planner estimates from: one
        entry per relation family, with observed row counts, estimate quality,
        execution latency, and the physical plans seen for it.

        These are query-planner statistics, not operational metrics or
        tracing. They are advisory: deleting them changes no query result, and
        they are gathered best-effort, so a value may be missing after process
        failure or backpressure.

        Several fields are deliberately approximate and named accordingly. A
        field ending `UpperBound` is a histogram bucket bound rather than an
        exact quantile, so it overstates; the matching exact maximum is
        reported beside it. Read the field descriptions before comparing
        numbers.

        A process that runs no collector — a reader instance gathers
        statistics only for its own planner and a writer is the only
        publisher — returns 404 rather than an empty body, so "this instance
        does not collect" is distinguishable from "nothing observed yet".
      tags: [meta]
      responses:
        default: { $ref: "#/components/responses/InternalServerError" }
        "200": { $ref: "#/components/responses/GetStatisticsOK" }
        "404": { $ref: "#/components/responses/NotFound" }

  /schema:
    get:
      operationId: GetSchema
      summary: Return the current accepted schema.
      description: Return the committed canonical schema together with its monotonic version and canonical hash.
      tags: [schema]
      responses:
        default: { $ref: "#/components/responses/InternalServerError" }
        "200": { $ref: "#/components/responses/GetSchemaOK" }

  /schema/diff:
    post:
      operationId: SchemaDiff
      summary: Plan and preflight a desired schema without changing anything.
      description: |
        This is an advisory point-in-time plan. The planner may account for
        matching durable work already in progress and omit a duplicate
        transition-start statement. Apply replans against current state and
        returns the authoritative transition identities accepted for the
        migration; diff does not return durable transition handles.
      tags: [schema]
      requestBody: { $ref: "#/components/requestBodies/SchemaDiff" }
      responses:
        default: { $ref: "#/components/responses/InternalServerError" }
        "200": { $ref: "#/components/responses/SchemaDiffOK" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /schema/migrate:
    post:
      operationId: SchemaMigrate
      summary: Start or recover reconciliation with a desired schema.
      description: |
        The server parses the desired schema, computes and preflights its
        semantic diff, and atomically commits immediate catalog work plus any
        durable online transition starts. The response is `ready` only when
        the current canonical schema equals `desired_hash`; otherwise it is
        `converging` and returns the transition identities to observe through
        the administrative API. Repeating the same desired-schema request
        recovers matching in-flight transitions instead of duplicating them.
        Destructive findings require `accept_data_loss`; blocking findings can
        never be bypassed.
      tags: [schema]
      requestBody: { $ref: "#/components/requestBodies/SchemaMigrate" }
      responses:
        default: { $ref: "#/components/responses/InternalServerError" }
        "200": { $ref: "#/components/responses/SchemaMigrateOK" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /schema/compatibility:
    post:
      operationId: SchemaCompatibility
      summary: Verify an exact generated-client schema identity.
      tags: [schema]
      requestBody: { $ref: "#/components/requestBodies/SchemaCompatibility" }
      responses:
        default: { $ref: "#/components/responses/InternalServerError" }
        "204": { $ref: "#/components/responses/NoContent" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /schema/transitions:
    get:
      operationId: SchemaTransitionList
      summary: List durable online schema transitions.
      description: |
        Return a coherent administrative snapshot of online schema work,
        including terminal transitions retained for diagnostics. Optional
        kind and state filters are applied to that snapshot. This endpoint
        never claims a worker or advances transition progress and is available
        in both direct and schema-managed catalog modes.
      tags: [administration]
      parameters:
        - name: kind
          in: query
          required: false
          description: Return only transitions using this physical protocol.
          schema: { $ref: "#/components/schemas/TransitionKind" }
        - name: state
          in: query
          required: false
          description: Return only transitions in this durable lifecycle state.
          schema: { $ref: "#/components/schemas/TransitionState" }
      responses:
        default: { $ref: "#/components/responses/InternalServerError" }
        "200": { $ref: "#/components/responses/SchemaTransitionListOK" }

  /schema/transitions/{transition}:
    get:
      operationId: SchemaTransitionGet
      summary: Inspect one durable online schema transition.
      description: |
        Return the current durable identity and lifecycle state plus advisory
        progress and retained-work pressure. The observation is read from one
        coherent storage snapshot and does not claim or advance a worker.
      tags: [administration]
      parameters:
        - { $ref: "#/components/parameters/TransitionID" }
      responses:
        default: { $ref: "#/components/responses/InternalServerError" }
        "200": { $ref: "#/components/responses/SchemaTransitionOK" }
        "404": { $ref: "#/components/responses/NotFound" }

  /schema/transitions/{transition}/cancel:
    post:
      operationId: SchemaTransitionCancel
      summary: Cancel one durable online schema transition.
      description: |
        Atomically invalidate worker ownership, remove the transition's
        foreground write obligations, and schedule partial physical state for
        reclamation. Cancellation is idempotent for an already-cancelled
        transition. Ready and failed transitions reject cancellation because
        they require deletion or cleanup instead. This administrative
        transaction cannot be interleaved with application statements in a PIR
        program and is available in both catalog management modes.
      tags: [administration]
      parameters:
        - { $ref: "#/components/parameters/TransitionID" }
      responses:
        default: { $ref: "#/components/responses/InternalServerError" }
        "200": { $ref: "#/components/responses/SchemaTransitionOK" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /tables:
    get:
      operationId: TableList
      summary: List the tables in the database.
      description: |
        Return every table currently defined in the catalog, along with its
        columns and primary key. This reflects the schema as it exists right
        now, after the most recent successful migration. An empty database
        returns an empty list, not an error.

        Use this to introspect a running server without access to the original
        `rad.schema.yaml` file.
      tags: [meta]
      responses:
        default: { $ref: "#/components/responses/InternalServerError" }
        "200": { $ref: "#/components/responses/TableListOK" }
    post:
      operationId: TableCreate
      summary: Create a table.
      description: |
        Define a new table in one call: columns, primary key, and optionally
        indexes and foreign keys, exactly as a `rad.schema.yaml` entry would. Stable
        schema IDs may be supplied or are assigned by the catalog, and the
        whole definition commits
        atomically — a rejected definition leaves nothing behind, including
        the name.

        Foreign keys may reference existing tables or the table being created
        (self-references), and must target the referenced table's full
        primary key. A definition that fails validation — duplicate or
        missing name, unsupported column type, nullable primary key column,
        index or key over unknown columns — is rejected with an `invalid`
        problem. On a schema-managed database this operation is always
        rejected.
      tags: [catalog]
      requestBody: { $ref: "#/components/requestBodies/TableCreate" }
      responses:
        default: { $ref: "#/components/responses/InternalServerError" }
        "200": { $ref: "#/components/responses/TableOK" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /tables/{table}:
    patch:
      operationId: TableUpdate
      summary: Update a table.
      description: |
        Update a table's properties. The only updatable property today is
        `name`: data keys use the table's ID, so a name change is
        metadata-only and instantaneous, and foreign keys referencing the
        table are unaffected. A name that is already taken is rejected with
        an `invalid` problem. On a schema-managed database this operation is
        always rejected.
      tags: [catalog]
      parameters:
        - { $ref: "#/components/parameters/TableName" }
      requestBody: { $ref: "#/components/requestBodies/TableUpdate" }
      responses:
        default: { $ref: "#/components/responses/InternalServerError" }
        "200": { $ref: "#/components/responses/TableOK" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
    delete:
      operationId: TableDelete
      summary: Delete a table.
      description: |
        Remove a table from the catalog. Its rows and index entries become
        unreachable; table IDs are never reused. A table that another table
        references through a foreign key cannot be deleted until the
        referencing table goes first (self-references do not count). On a
        schema-managed database this operation is always rejected.
      tags: [catalog]
      parameters:
        - { $ref: "#/components/parameters/TableName" }
      responses:
        default: { $ref: "#/components/responses/InternalServerError" }
        "204": { $ref: "#/components/responses/NoContent" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /tables/{table}/columns:
    post:
      operationId: ColumnCreate
      summary: Create a column on a table.
      description: |
        Append a column. Because existing rows have no value for it, the
        column must be nullable or carry a literal default; generator
        defaults (`uuid()`, `now_ms()`) are rejected on new columns of
        existing tables since they would produce a different value on every
        read of an old row. On a schema-managed database this operation is
        always rejected.
      tags: [catalog]
      parameters:
        - { $ref: "#/components/parameters/TableName" }
      requestBody: { $ref: "#/components/requestBodies/ColumnCreate" }
      responses:
        default: { $ref: "#/components/responses/InternalServerError" }
        "200": { $ref: "#/components/responses/TableOK" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /tables/{table}/columns/{column}:
    patch:
      operationId: ColumnUpdate
      summary: Update a column.
      description: |
        Update a column's properties. The only updatable property today is
        `name`; changing a column's type or nullability is not supported. A
        name change rewrites every metadata reference to the column (primary
        key, indexes, foreign keys), and rows are keyed by column ID, so no
        data is touched. On a schema-managed database this operation is
        always rejected.
      tags: [catalog]
      parameters:
        - { $ref: "#/components/parameters/TableName" }
        - { $ref: "#/components/parameters/ColumnName" }
      requestBody: { $ref: "#/components/requestBodies/ColumnUpdate" }
      responses:
        default: { $ref: "#/components/responses/InternalServerError" }
        "200": { $ref: "#/components/responses/TableOK" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
    delete:
      operationId: ColumnDelete
      summary: Delete a column.
      description: |
        Remove a column. Stored values for it become unreachable. A column
        used by the primary key, an index, or a foreign key cannot be
        deleted — delete the index or foreign key holder first. On a
        schema-managed database this operation is always rejected.
      tags: [catalog]
      parameters:
        - { $ref: "#/components/parameters/TableName" }
        - { $ref: "#/components/parameters/ColumnName" }
      responses:
        default: { $ref: "#/components/responses/InternalServerError" }
        "200": { $ref: "#/components/responses/TableOK" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /tables/{table}/indexes:
    post:
      operationId: IndexCreate
      summary: Create an index on a table.
      description: |
        Register a secondary index and backfill entries for every existing
        row, atomically: the index never becomes visible without its
        entries. Backfilling a unique index over data that already contains
        duplicates fails with an `invalid` problem — retrying cannot succeed
        until the data changes — and the registration is rolled back with
        it. On a schema-managed database this operation is always rejected.
      tags: [catalog]
      parameters:
        - { $ref: "#/components/parameters/TableName" }
      requestBody: { $ref: "#/components/requestBodies/IndexCreate" }
      responses:
        default: { $ref: "#/components/responses/InternalServerError" }
        "200": { $ref: "#/components/responses/TableOK" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /tables/{table}/indexes/{index}:
    delete:
      operationId: IndexDelete
      summary: Delete an index.
      description: |
        Remove an index from the catalog. Its entries become unreachable;
        index IDs are never reused. Queries that would have used it fall
        back to other access paths. On a schema-managed database this
        operation is always rejected.
      tags: [catalog]
      parameters:
        - { $ref: "#/components/parameters/TableName" }
        - { $ref: "#/components/parameters/IndexName" }
      responses:
        default: { $ref: "#/components/responses/InternalServerError" }
        "200": { $ref: "#/components/responses/TableOK" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /execute:
    post:
      operationId: Execute
      summary: Run an execution program.
      description: |
        Execute a program: an ordered list of named statements run as one
        atomic transaction. Each statement is a `query`, `create`, `update`,
        or `delete` over an LIR relation, and evaluates against the
        transaction's snapshot plus the effects of all preceding statements.
        A statement's result is available to later statements, by name,
        through an LIR `ref` — statement names share the binding namespace.

        Mutations consume relations rather than literal rows: `create` inserts
        a relation's rows, `update` and `delete` identify target rows by the
        relation's primary-key columns. A literal row is simply a one-row
        `rows` relation.

        Exactly one statement's result is returned, named by `result` (or the
        sole statement of a single-statement program). The response also
        carries a per-statement summary of affected row counts. If any
        statement fails validation or execution, or the commit loses a
        serializable race, the whole program fails and no effects become
        visible; a failed statement is named in the error.

        The program envelope is validated before binding, and each statement's
        LIR relation against the independent LIR schema. Binding then resolves
        tables, columns, scopes, and statement references (which must point at
        earlier statements).
      tags: [data]
      parameters:
        - name: show-plan
          in: query
          required: false
          description: |
            When true, the response carries the query plan for each statement —
            the physical plan and the planner's access-path decisions — as
            free-form JSON under `plan`, alongside the result (and on the
            problem when a statement fails after planning).
          schema: { type: boolean }
        - name: dry-run
          in: query
          required: false
          description: |
            When true, bind and plan every statement but execute none: no writes,
            no result. With `show-plan` this returns the plan only; alone it is a
            "will this bind and plan?" validation that returns an empty success.
          schema: { type: boolean }
      requestBody: { $ref: "#/components/requestBodies/Execute" }
      responses:
        default: { $ref: "#/components/responses/InternalServerError" }
        "200": { $ref: "#/components/responses/ExecuteOK" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

components:
  parameters:
    TableName:
      name: table
      in: path
      required: true
      description: The table's current name.
      schema:
        type: string

    ColumnName:
      name: column
      in: path
      required: true
      description: The column's current name.
      schema:
        type: string

    IndexName:
      name: index
      in: path
      required: true
      description: The index's name.
      schema:
        type: string

    TransitionID:
      name: transition
      in: path
      required: true
      description: The durable transition identity returned when the work started.
      schema:
        type: string
        minLength: 1

  requestBodies:
    SchemaDiff:
      content:
        application/json:
          schema: { $ref: "#/components/schemas/SchemaRequest" }

    SchemaMigrate:
      content:
        application/json:
          schema: { $ref: "#/components/schemas/SchemaMigrateRequest" }

    SchemaCompatibility:
      content:
        application/json:
          schema: { $ref: "#/components/schemas/SchemaCompatibilityRequest" }

    Execute:
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Program" }

    TableCreate:
      content:
        application/json:
          schema: { $ref: "#/components/schemas/TableDef" }

    TableUpdate:
      content:
        application/json:
          schema: { $ref: "#/components/schemas/TableUpdateProps" }

    ColumnCreate:
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ColumnDef" }

    ColumnUpdate:
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ColumnUpdateProps" }

    IndexCreate:
      content:
        application/json:
          schema: { $ref: "#/components/schemas/IndexInfo" }

  responses:
    InternalServerError:
      description: Something went wrong inside the server that was not the caller's fault.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    BadRequest:
      description: The request body was malformed or could not be decoded.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: The operation requires a write instance.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: The addressed resource, such as a transaction, does not exist.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: The write lost an optimistic race; an immediate retry may win.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    UnprocessableEntity:
      description: The request was well formed but failed validation against the catalog.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NoContent:
      description: The operation succeeded and there is no body to return.

    GetHealthzOK:
      description: The server is alive.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Health" }
    ProbePassed:
      description: The probed condition holds.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ProbeStatus" }
    ProbeFailed:
      description: The probed condition does not hold.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ProbeStatus" }
    GetInfoOK:
      description: Metadata about the database behind this endpoint.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/DatabaseInfo" }
    GetStatisticsOK:
      description: The planner statistics this instance currently holds.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Statistics" }
    GetSchemaOK:
      description: The current accepted schema and identity.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/SchemaState" }
    SchemaDiffOK:
      description: The semantic diff, catalog PIR, and preflight findings.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/SchemaDiffResult" }
    TableListOK:
      description: The current set of tables.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/TableList" }
    TableOK:
      description: The table's definition after the mutation was applied.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/TableInfo" }
    SchemaMigrateOK:
      description: The committed accepted schema and its identity.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/SchemaMigrateResult" }
    SchemaTransitionOK:
      description: The transition's durable administrative state.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/TransitionControl" }
    SchemaTransitionListOK:
      description: A coherent snapshot of durable schema transitions.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/TransitionList" }
    ExecuteOK:
      description: The result statement's datum plus a per-statement summary.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ProgramResult" }

  schemas:
    Access:
      description: Whether this process serves a checkpoint reader or owns the Slate writer.
      type: string
      enum: [read, write]

    Problem:
      description: |
        An RFC 7807 Problem Details object. Every non-2xx response carries one.
        `code` is the stable top-level discriminator; `reason` is the
        fine-grained semantic identity within that class.
      oneOf:
        - $ref: "#/components/schemas/InvalidProblem"
        - $ref: "#/components/schemas/ExecutionFailedProblem"
        - $ref: "#/components/schemas/NotFoundProblem"
        - $ref: "#/components/schemas/ConflictProblem"
        - $ref: "#/components/schemas/InternalProblem"
      discriminator:
        propertyName: code
        mapping:
          invalid: "#/components/schemas/InvalidProblem"
          execution_failed: "#/components/schemas/ExecutionFailedProblem"
          not_found: "#/components/schemas/NotFoundProblem"
          conflict: "#/components/schemas/ConflictProblem"
          internal: "#/components/schemas/InternalProblem"

    ProblemBase:
      type: object
      required: [type, title, status, reason]
      properties:
        type:
          description: A stable class-level URN such as `urn:rad:problem:conflict`.
          type: string
        title:
          description: A short human-readable summary of the problem class.
          type: string
        status:
          description: The HTTP status code, repeated in the body for convenience.
          type: integer
        detail:
          description: A human readable explanation specific to this occurrence.
          type: string
        reason:
          description: |
            The stable fine-grained identity within the problem class. Reasons
            accumulate over time; generated clients must preserve unknown
            strings and fall back to `code` rather than rejecting a response.
          type: string

    ProblemStage:
      description: The engine stage that rejected or failed the operation.
      type: string
      enum: [schema, preflight, binding, planning, execution, storage]

    ProblemLocation:
      description: |
        Identifies the request construct associated with the problem. JSON
        Pointer is machine-navigable; the other fields are semantic labels.
        Fields are omitted when that provenance is unavailable. Table, index,
        column, binding, and node names may appear; key bytes and row values
        never do.
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        pointer:
          description: An RFC 6901 JSON Pointer into the submitted document.
          type: string
        node:
          description: The LIR node identifier associated with the problem.
          type: string
        binding:
          description: The binding name associated with the problem.
          type: string
        scope:
          description: The relation scope associated with the problem.
          type: string
        role:
          description: A display-oriented structural role such as `predicate` or `order term 0`.
          type: string

    InvalidDiagnostic:
      description: One diagnostic within a multi-error invalid problem.
      type: object
      additionalProperties: false
      required: [reason, detail]
      properties:
        reason:
          type: string
        detail:
          type: string
        location:
          $ref: "#/components/schemas/ProblemLocation"

    InvalidProblem:
      allOf:
        - $ref: "#/components/schemas/ProblemBase"
        - type: object
          required: [code, stage]
          properties:
            type:
              type: string
              enum: ["urn:rad:problem:invalid"]
            title:
              type: string
              enum: ["Invalid Request"]
            status:
              type: integer
              minimum: 400
              maximum: 499
            code:
              type: string
              enum: [invalid]
            stage:
              $ref: "#/components/schemas/ProblemStage"
            location:
              $ref: "#/components/schemas/ProblemLocation"
            errors:
              description: Multiple independent diagnostics, when accumulation is available.
              type: array
              minItems: 2
              items: { $ref: "#/components/schemas/InvalidDiagnostic" }

    ExecutionContext:
      description: The physical execution identity available at failure.
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        operator:
          description: The stable physical operator name used by EXPLAIN.
          type: string
        operator_id:
          type: string
        table:
          type: string
        index:
          type: string
        binding:
          type: string
        crossing:
          type: string

    ExecutionFailedProblem:
      allOf:
        - $ref: "#/components/schemas/ProblemBase"
        - type: object
          required: [code, stage]
          properties:
            type:
              type: string
              enum: ["urn:rad:problem:execution_failed"]
            title:
              type: string
              enum: ["Query Execution Failed"]
            status:
              type: integer
              enum: [422]
            code:
              type: string
              enum: [execution_failed]
            stage:
              $ref: "#/components/schemas/ProblemStage"
            location:
              $ref: "#/components/schemas/ProblemLocation"
            execution:
              $ref: "#/components/schemas/ExecutionContext"

    ConflictObject:
      type: string
      enum: [table, index]

    ConflictOperation:
      type: string
      enum: [read, insert, update, delete]

    ConflictContext:
      description: Schema-level identity for a raced object, when resolvable.
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        object:
          $ref: "#/components/schemas/ConflictObject"
        table:
          type: string
        index:
          type: string
        operation:
          $ref: "#/components/schemas/ConflictOperation"

    ConflictProblem:
      allOf:
        - $ref: "#/components/schemas/ProblemBase"
        - type: object
          required: [code, stage]
          properties:
            type:
              type: string
              enum: ["urn:rad:problem:conflict"]
            title:
              type: string
              enum: ["Transaction Conflict"]
            status:
              type: integer
              enum: [409]
            code:
              type: string
              enum: [conflict]
            stage:
              $ref: "#/components/schemas/ProblemStage"
            conflict:
              $ref: "#/components/schemas/ConflictContext"

    ResourceContext:
      description: The addressed API resource, without storage keys or row values.
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          type: string
        name:
          type: string

    NotFoundProblem:
      allOf:
        - $ref: "#/components/schemas/ProblemBase"
        - type: object
          required: [code, stage]
          properties:
            type:
              type: string
              enum: ["urn:rad:problem:not_found"]
            title:
              type: string
              enum: ["Not Found"]
            status:
              type: integer
              enum: [404]
            code:
              type: string
              enum: [not_found]
            stage:
              $ref: "#/components/schemas/ProblemStage"
            resource:
              $ref: "#/components/schemas/ResourceContext"

    InternalProblem:
      description: |
        A deliberately impoverished internal failure. Wrapped causes,
        locations, execution context, catalog identity, keys, and values are
        never exposed. `incident` is an optional opaque log correlation ID.
      allOf:
        - $ref: "#/components/schemas/ProblemBase"
        - type: object
          required: [code]
          properties:
            type:
              type: string
              enum: ["urn:rad:problem:internal"]
            title:
              type: string
              enum: ["Internal Server Error"]
            status:
              type: integer
              enum: [500]
            code:
              type: string
              enum: [internal]
            reason:
              type: string
              enum: [internal]
            incident:
              description: An opaque identifier correlated with server-side diagnostics.
              type: string

    Value:
      description: An arbitrary JSON value carried by the HTTP protocol.

    Program:
      description: |
        An arbitrary JSON object containing a PIR execution program. As with
        `Query`, the HTTP contract does not describe the PIR grammar; servers
        validate this raw body against the independent PIR JSON Schema, and
        each statement's relation against the LIR schema.

    ColumnDefault:
      description: |
        A column default, applied when an insert omits the column: either a
        builtin generator named by `func` (`uuid` on text columns, `now_ms`
        on int64 columns) or a literal `value` of the column's type. Exactly
        one of the two is set.
      type: object
      properties:
        func:
          description: A builtin generator, `uuid` or `now_ms`.
          type: string
        value:
          description: A literal of the column's type.
          allOf:
            - $ref: "#/components/schemas/Value"

    ColumnInfo:
      description: One column of a table, as reported by introspection.
      type: object
      required: [id, name, type]
      properties:
        id:
          description: The stable logical column identity within its table.
          type: integer
          format: int64
          minimum: 1
          maximum: 2147483647
        name:
          type: string
        type:
          description: The column's storage type, one of `text`, `int64`, `float64`, or `bool`.
          type: string
        nullable:
          type: boolean
        format:
          description: An optional semantic hint such as `uuid` or `unix_ms`.
          type: string
        default:
          $ref: "#/components/schemas/ColumnDefault"

    ColumnDef:
      description: A column definition for a direct catalog create operation.
      type: object
      required: [name, type]
      properties:
        id:
          description: An optional stable logical identity; direct mode allocates one when omitted.
          type: integer
          format: int64
          minimum: 1
          maximum: 2147483647
        name:
          type: string
        type:
          description: The column's storage type, one of `text`, `int64`, `float64`, or `bool`.
          type: string
        nullable:
          type: boolean
        format:
          description: An optional semantic hint such as `uuid` or `unix_ms`.
          type: string
        default:
          $ref: "#/components/schemas/ColumnDefault"

    IndexInfo:
      description: One secondary index, in both definitions and introspection.
      type: object
      required: [name, columns]
      properties:
        name:
          type: string
        columns:
          description: The indexed column names, in order.
          type: array
          items:
            type: string
        unique:
          type: boolean

    ForeignKeyInfo:
      description: |
        One foreign key, in both definitions and introspection. The
        referenced columns must be the referenced table's full primary key.
      type: object
      required: [name, columns, ref_table, ref_columns]
      properties:
        name:
          type: string
        columns:
          description: The referencing column names on this table.
          type: array
          items:
            type: string
        ref_table:
          description: The referenced table's name.
          type: string
        ref_columns:
          description: The referenced table's primary key columns, in order.
          type: array
          items:
            type: string

    TableInfo:
      description: One table's definition, as reported by introspection.
      type: object
      required: [id, name, columns, primary_key]
      properties:
        id:
          description: The stable logical table identity within this database.
          type: integer
          format: int64
          minimum: 1
          maximum: 2147483647
        name:
          type: string
        columns:
          type: array
          items: { $ref: "#/components/schemas/ColumnInfo" }
        primary_key:
          description: The column names that make up the primary key, in order.
          type: array
          items:
            type: string
        indexes:
          type: array
          items: { $ref: "#/components/schemas/IndexInfo" }
        foreign_keys:
          type: array
          items: { $ref: "#/components/schemas/ForeignKeyInfo" }

    TableDef:
      description: |
        A new table's definition, mirroring a `rad.schema.yaml` entry as JSON. The
        direct API may omit logical IDs for the catalog to allocate. Column
        types are `text`, `int64`, `float64`, or `bool`; the primary key is
        required and its columns must not be nullable.
      type: object
      required: [name, columns, primary_key]
      properties:
        id:
          description: An optional stable logical identity; direct mode allocates one when omitted.
          type: integer
          format: int64
          minimum: 1
          maximum: 2147483647
        name:
          type: string
        columns:
          type: array
          items: { $ref: "#/components/schemas/ColumnDef" }
        primary_key:
          type: array
          items:
            type: string
        indexes:
          type: array
          items: { $ref: "#/components/schemas/IndexInfo" }
        foreign_keys:
          type: array
          items: { $ref: "#/components/schemas/ForeignKeyInfo" }

    Health:
      description: The liveness status of the server.
      type: object
      required: [status, access, mode]
      properties:
        status:
          type: string
        access: { $ref: "#/components/schemas/Access" }
        mode:
          description: |
            The database's catalog management mode: `direct` (the catalog
            is mutable over this API) or `schema` (rad.schema.yaml migrations own
            the catalog and the imperative catalog operations are rejected).
          type: string

    ProbeStatus:
      description: >
        Why a probe answered as it did. The HTTP status is the answer; this body
        is a diagnostic for whoever is reading `curl` output or a failing test,
        and orchestrators ignore it.
      type: object
      required: [reason]
      properties:
        reason:
          description: >
            A stable token naming the process state behind the result. Each
            probe reports its own set, listed in that operation's description.
          type: string

    DatabaseInfo:
      description: Stable metadata about a Rad database.
      type: object
      required: [access, mode, schema_version, schema_hash]
      properties:
        access: { $ref: "#/components/schemas/Access" }
        mode:
          description: |
            The database's catalog management mode: `direct` (the catalog
            is mutable over this API) or `schema` (rad.schema.yaml migrations own
            the catalog and the imperative catalog operations are rejected).
          type: string
          enum: [direct, schema]
        schema_version:
          description: |
            The monotonic version of the committed schema. A fresh database
            starts at zero. Each catalog change in direct mode increments it
            once, including each reconciler step; an entire schema-managed
            migration increments it once.
          type: integer
          format: int64
          minimum: 0
        schema_hash:
          description: SHA-256 of the canonical committed schema JSON.
          type: string
        schema_version_at:
          description: When the current schema version committed. Absent at version zero.
          type: string
          format: date-time
        location:
          description: The configured backing-store location, when the server exposes one.
          type: string

    TableList:
      description: The set of tables defined in the database.
      type: object
      required: [tables]
      properties:
        tables:
          type: array
          items: { $ref: "#/components/schemas/TableInfo" }

    SchemaRequest:
      description: A desired schema source to plan.
      type: object
      required: [schema]
      additionalProperties: false
      properties:
        schema:
          description: The full `rad.schema.yaml` source document, as YAML.
          type: string

    SchemaMigrateRequest:
      description: A desired schema, the preflighted server identity, and explicit data-loss consent.
      type: object
      required: [schema, current_version, current_hash]
      additionalProperties: false
      properties:
        schema:
          type: string
        current_version:
          type: integer
          format: int64
          minimum: 0
        current_hash:
          type: string
        accept_data_loss:
          type: boolean

    SchemaCompatibilityRequest:
      type: object
      required: [schema_version, schema_hash]
      additionalProperties: false
      properties:
        schema_version:
          type: integer
          format: int64
          minimum: 0
        schema_hash:
          type: string

    SchemaDocument:
      description: The accepted canonical logical schema.
      type: object
      required: [tables]
      properties:
        tables:
          type: array
          items: { $ref: "#/components/schemas/TableDef" }

    StatisticsRelay:
      type: object
      additionalProperties: false
      required: [received, receivedAlreadyApplied, receivedRejected, receivedSaturated, receivedCorpusOversize, sources, mergedObservations, corpusAdopted, refusedStaleFamilies]
      description: |
        The observation relay, as this instance sees it. An instance that
        cannot publish to storage hands its evidence to one that can; the
        channel is advisory, so every loss here is counted rather than
        signalled as a failure.

        The sending fields are absent on an instance that publishes to storage
        rather than to a peer. The receiving fields are always present,
        because every instance can receive; zero means nothing has arrived.
      properties:
        state:
          type: string
          enum: [connected, retrying, losing, idle]
          description: |
            The sending side in one word. `retrying` means a batch is held for
            another attempt and no evidence has been lost yet. `losing` means
            a batch was abandoned or refused, so evidence was dropped, and it
            stays reported until a later attempt succeeds. Absent on an
            instance that does not send.
        sent:
          type: integer
          format: int64
          description: Batches this instance successfully handed to a peer.
        abandoned:
          type: integer
          format: int64
          description: |
            Batches given up on after exhausting their retry budget. Each one
            is evidence permanently lost, which costs the fleet planner
            accuracy and nothing else.
        rejected:
          type: integer
          format: int64
          description: |
            Batches a peer understood and refused, most often a wire-format
            mismatch during a rolling upgrade. Retrying cannot help, so these
            are not retried.
        holding:
          type: boolean
          description: Whether a batch is currently awaiting another attempt.
        corpusSent:
          type: integer
          format: int64
          description: |
            Workload-corpus documents carried to a peer. These contain the
            literal values of the programs that ran, unlike the aggregate
            evidence beside them, so they travel only over a transport shown to
            be confidential — encrypted *and* verified.
        corpusWithheld:
          type: integer
          format: int64
          description: |
            Corpus documents dropped because the transport could not be shown
            confidential. An instance that cannot publish has nowhere else to
            put them. A non-zero value with corpus capture requested means the
            channel is not encrypted.
        received:
          type: integer
          format: int64
          description: Batches accepted from a peer and queued to be merged.
        receivedAlreadyApplied:
          type: integer
          format: int64
          description: |
            Batches whose sequence this instance had already applied. Delivery
            is at-least-once and the accounting is idempotent, so a repeat is
            expected traffic rather than a fault.
        receivedRejected:
          type: integer
          format: int64
          description: Batches refused because they use a different wire format.
        receivedSaturated:
          type: integer
          format: int64
          description: |
            Batches refused because the merge queue was full. The sender is
            asked to retry and nothing is recorded as applied, so a saturated
            receiver costs latency rather than evidence.
        receivedCorpusOversize:
          type: integer
          format: int64
          description: Batches refused because one corpus document exceeded 1 MiB.
        sources:
          type: integer
          format: int64
          description: |
            Peers whose applied sequence this instance remembers. A peer that
            falls out of that bounded set is re-admitted on its next batch.
        mergedObservations:
          type: integer
          format: int64
          description: Observations folded in from peers.
        corpusAdopted:
          type: integer
          format: int64
          description: |
            Corpus documents adopted from peers. Content addressing makes a
            duplicate harmless, so this counts documents received rather than
            documents newly stored.
        refusedStaleFamilies:
          type: integer
          format: int64
          description: |
            Relayed families discarded because they described a different
            catalog generation than this instance observed. A peer lagging a
            catalog change must never displace newer local evidence.

    Statistics:
      type: object
      additionalProperties: false
      required: [absorbed, dropped, evicted, shed, corpus, relay, trackedFamilies, models, synopses]
      properties:
        absorbed:
          type: integer
          format: int64
          description: Observations folded into the models since this process started.
        dropped:
          type: integer
          format: int64
          description: |
            Observations discarded because the collection queue was full.
            Execution never blocks to record statistics, so a busy instance
            sheds observations rather than slowing queries.
        evicted:
          type: integer
          format: int64
          description: |
            Models discarded to keep the working set bounded. The frequency
            sketch keeps counting an evicted family, so a family that stays
            active is re-admitted.
        shed:
          type: integer
          format: int64
          description: |
            Unpublished evidence discarded to keep the pending set bounded.
            Evidence already published is unaffected: what reaches the store
            accumulates there.
        corpus:
          $ref: "#/components/schemas/StatisticsCorpus"
        relay:
          $ref: "#/components/schemas/StatisticsRelay"
        trackedFamilies:
          type: integer
          description: Relation families currently modelled.
        models:
          type: array
          items: { $ref: "#/components/schemas/StatisticsModel" }
          description: One entry per modelled family, most measured first.
        synopses:
          type: array
          items: { $ref: "#/components/schemas/StatisticsSynopsis" }
          description: Current table survey results, ordered by table identity.
        physicalCost:
          $ref: "#/components/schemas/StatisticsPhysicalCost"

    StatisticsCorpus:
      type: object
      additionalProperties: false
      required: [enabled, captured, skippedOversize, droppedQueue, shedPending]
      properties:
        enabled:
          type: boolean
          description: Whether this process captures canonical workload programs.
        captured:
          type: integer
          format: int64
          description: Programs admitted to the local statistics queue.
        skippedOversize:
          type: integer
          format: int64
          description: Programs not captured because one canonical document exceeded the capture limit.
        droppedQueue:
          type: integer
          format: int64
          description: Programs not captured because the collection queue was full.
        shedPending:
          type: integer
          format: int64
          description: Captured programs removed from the bounded unpublished queue.
        maintenance:
          allOf:
            - $ref: "#/components/schemas/StatisticsCorpusMaintenance"
          description: |
            Storage maintenance data. This field is absent when this process
            does not own corpus storage.

    StatisticsCorpusMaintenance:
      type: object
      additionalProperties: false
      required:
        [
          expiredExecutions,
          prunedExecutions,
          invalidExecutions,
          prunedPrograms,
          invalidPrograms,
          erasedExecutions,
          erasedPrograms,
          retainedExecutions,
          retainedPrograms,
          retainedProgramBytes,
        ]
      description: |
        Cumulative maintenance counters and current retained corpus gauges.
        Counters start when the storage owner process starts.
      properties:
        expiredExecutions:
          type: integer
          format: int64
          description: Execution records removed because the maximum age elapsed.
        prunedExecutions:
          type: integer
          format: int64
          description: Execution records removed to enforce the count or byte limit.
        invalidExecutions:
          type: integer
          format: int64
          description: Execution records removed because their key, value, or program reference was invalid.
        prunedPrograms:
          type: integer
          format: int64
          description: Canonical programs removed because no retained execution referenced them.
        invalidPrograms:
          type: integer
          format: int64
          description: Canonical programs removed because their storage key was invalid.
        erasedExecutions:
          type: integer
          format: int64
          description: Execution records removed by explicit corpus erasure.
        erasedPrograms:
          type: integer
          format: int64
          description: Canonical programs removed by explicit corpus erasure.
        retainedExecutions:
          type: integer
          format: int64
          description: Execution records currently retained.
        retainedPrograms:
          type: integer
          format: int64
          description: Unique canonical programs currently retained.
        retainedProgramBytes:
          type: integer
          format: int64
          description: Bytes in retained canonical programs. This excludes execution records and storage overhead.

    StatisticsSynopsis:
      type: object
      additionalProperties: false
      required:
        [
          table,
          observedRows,
          coverage,
          sampleSize,
          changesSinceCollection,
          tableExistenceGeneration,
          collectedAtUnixMicros,
          catalogVersion,
          columns,
          columnGroups,
        ]
      properties:
        table:
          type: integer
          format: int64
          description: Stable table schema identity.
        observedRows:
          type: integer
          format: int64
          description: Rows read by the survey.
        coverage:
          type: string
          enum: [complete, prefixLimit]
          description: Whether the survey read the complete table or a bounded prefix.
        sampleSize:
          type: integer
          format: int64
          description: Rows used to build the synopsis.
        changesSinceCollection:
          type: integer
          format: int64
          description: Rows affected by writes after collection.
        tableExistenceGeneration:
          type: integer
          format: int64
          description: Table generation that this synopsis describes.
        collectedAtUnixMicros:
          type: integer
          format: int64
          description: Collection wall time in microseconds since the Unix epoch.
        catalogVersion:
          type: integer
          format: int64
          description: Catalog version read by the survey.
        columns:
          type: array
          items: { $ref: "#/components/schemas/StatisticsColumnSynopsis" }
        columnGroups:
          type: array
          items: { $ref: "#/components/schemas/StatisticsColumnGroupSynopsis" }
          description: Bounded joint statistics for primary-key prefixes, ready multi-column index prefixes, and composite foreign keys.

    StatisticsColumnSynopsis:
      type: object
      additionalProperties: false
      required:
        [
          column,
          valueGeneration,
          nullFraction,
          nullCount,
          distinct,
          distinctIsExact,
          averageWidth,
          mostCommonValues,
        ]
      properties:
        column:
          type: integer
          format: int64
          description: Stable column schema identity.
        valueGeneration:
          type: integer
          format: int64
          description: Column value generation that this synopsis describes.
        nullFraction:
          type: number
          format: double
          description: Fraction of observed rows that contained null.
        nullCount:
          type: integer
          format: int64
          description: Observed rows that contained null.
        distinct:
          type: integer
          format: int64
          description: Exact or approximate observed distinct non-null values.
        distinctIsExact:
          type: boolean
          description: Whether distinct is exact.
        averageWidth:
          type: integer
          format: int64
          description: Average encoded width of observed non-null values.
        minimum:
          type: string
          description: Rendered minimum non-null value.
        maximum:
          type: string
          description: Rendered maximum non-null value.
        mostCommonValues:
          type: array
          items: { $ref: "#/components/schemas/StatisticsMostCommonValue" }
          description: Bounded heavy hitters, ordered by decreasing observed frequency.

    StatisticsMostCommonValue:
      type: object
      additionalProperties: false
      required: [value, frequency, lowerFrequency, maximumError]
      properties:
        value:
          type: string
          description: Rendered typed value.
        frequency:
          type: integer
          format: int64
          description: Space-Saving frequency upper bound.
        lowerFrequency:
          type: integer
          format: int64
          description: Guaranteed observed frequency lower bound.
        maximumError:
          type: integer
          format: int64
          description: Maximum Space-Saving overcount.

    StatisticsColumnGroupSynopsis:
      type: object
      additionalProperties: false
      required:
        [columns, valueGenerations, nullCount, distinct, distinctIsExact, mostCommonValues]
      properties:
        columns:
          type: array
          items:
            type: integer
            format: int64
          description: Stable column schema identities in canonical order.
        valueGenerations:
          type: array
          items:
            type: integer
            format: int64
          description: Column value generations in the same order as columns.
        nullCount:
          type: integer
          format: int64
          description: Observed rows where one or more group columns contained null.
        distinct:
          type: integer
          format: int64
          description: Exact or approximate observed distinct non-null value combinations.
        distinctIsExact:
          type: boolean
          description: Whether distinct is exact.
        mostCommonValues:
          type: array
          items: { $ref: "#/components/schemas/StatisticsMostCommonColumnGroup" }
          description: Bounded common value combinations, ordered by decreasing observed frequency.

    StatisticsMostCommonColumnGroup:
      type: object
      additionalProperties: false
      required: [values, frequency, lowerFrequency, maximumError]
      properties:
        values:
          type: array
          items:
            type: string
          description: Rendered typed values in the column order.
        frequency:
          type: integer
          format: int64
          description: Space-Saving frequency upper bound.
        lowerFrequency:
          type: integer
          format: int64
          description: Guaranteed observed frequency lower bound.
        maximumError:
          type: integer
          format: int64
          description: Maximum Space-Saving overcount.

    StatisticsModel:
      type: object
      additionalProperties: false
      required:
        [
          kind,
          family,
          exactVariants,
          frequency,
          retainedExecutions,
          executionsWithEstimate,
          rowsP50UpperBound,
          rowsP95UpperBound,
          rowsMax,
          qErrorP50UpperBound,
          qErrorP95UpperBound,
          qErrorMax,
          plans,
        ]
      properties:
        kind:
          type: string
          description: |
            `relation` contains logical relation cardinality feedback.
            `statement` contains complete statement performance and plan data.
        family:
          type: string
          description: |
            Family fingerprint: the relation shape with every literal replaced
            by a typed placeholder, so the same shape run with different
            parameters shares one entry. Carries the canonicalization version
            and hash algorithm that produced it.
        exactVariants:
          type: integer
          format: int64
          description: |
            Approximate distinct literal-specific instances seen within this
            family. A fixed-size mergeable sketch produces this value. One
            means an effectively constant query. A large value means a
            parameterised query.
        frequency:
          type: integer
          format: int64
          description: |
            Approximate number of times this family appeared anywhere in an
            executed query tree, from a count-min sketch. It over-counts on
            hash collision and halves periodically, so it reflects recent
            workload weight rather than a lifetime total. Expect it to exceed
            `retainedExecutions`: a family is counted once per appearance as a
            subtree but measured only where a plan boundary exposes its rows.
        retainedExecutions:
          type: integer
          format: int64
          description: Times this family was itself measured.
        executionsWithEstimate:
          type: integer
          format: int64
          description: |
            Of those, how many carried a planner estimate to score against the
            actual row count. Zero means nothing has scored this family yet.
        rowsP50UpperBound:
          type: integer
          format: int64
          description: |
            Upper bound on the median row count: the bound of the histogram
            bucket holding it, never above `rowsMax`. Not an exact quantile.
        rowsP95UpperBound:
          type: integer
          format: int64
          description: Upper bound on the 95th-percentile row count.
        rowsMax:
          type: integer
          format: int64
          description: Largest row count observed, exactly.
        qErrorP50UpperBound:
          type: number
          description: |
            Upper bound on the median estimate error, symmetric and
            multiplicative: 1.0 is a perfect estimate and 10.0 is wrong by a
            factor of ten in either direction. A bucket bound, never above
            `qErrorMax`.
        qErrorP95UpperBound:
          type: number
          description: Upper bound on the 95th-percentile estimate error.
        qErrorMax:
          type: number
          description: Largest estimate error observed, exactly.
        executeMicrosP50UpperBound:
          type: integer
          format: int64
          description: |
            Upper bound on median execution time in microseconds. Absent when
            this family was measured only as a relation inside a statement,
            which records rows but not durations.
        executeMicrosP95UpperBound:
          type: integer
          format: int64
          description: Upper bound on 95th-percentile execution time in microseconds.
        durationEwmaMicros:
          type: integer
          format: int64
          description: |
            Exponentially weighted mean execution time, a recent-trend signal
            rather than a distribution. Absent alongside the latency bounds.
        plans:
          type: array
          items: { $ref: "#/components/schemas/StatisticsPlan" }
          description: Physical plans observed for this family, with how often each ran.
        planningValue:
          $ref: "#/components/schemas/StatisticsPlanningValue"
        resourceCost:
          $ref: "#/components/schemas/StatisticsResourceCost"

    StatisticsPlan:
      type: object
      additionalProperties: false
      required: [plan, executions]
      properties:
        plan:
          type: string
          description: |
            Structural fingerprint of the physical plan: operator shapes,
            access paths, join order, and binding strategies, excluding
            literal values.
        executions:
          type: integer
          format: int64
          description: Times this plan ran for this family.

    StatisticsResourceMetric:
      type: object
      additionalProperties: false
      required: [p50UpperBound, p95UpperBound, maximum]
      properties:
        p50UpperBound:
          type: integer
          format: int64
          description: Upper bound on the median value.
        p95UpperBound:
          type: integer
          format: int64
          description: Upper bound on the 95th-percentile value.
        maximum:
          type: integer
          format: int64
          description: Largest observed value, exactly.

    StatisticsResourceCost:
      type: object
      additionalProperties: false
      required: [basis, observedExecutions, gets, puts, deletes, scans, iterated, bytesRead, bytesWritten]
      description: |
        Observed logical KV work for complete statement executions. This is
        not CPU, memory, object-request, or remote-I/O cost. A relation model
        has no resource cost because shared statement work cannot be assigned
        to one relation without an operator measurement boundary.
      properties:
        basis:
          type: string
          enum: [logical_kv_work]
        observedExecutions:
          type: integer
          format: int64
          description: Complete statement executions in these distributions.
        gets:
          $ref: "#/components/schemas/StatisticsResourceMetric"
        puts:
          $ref: "#/components/schemas/StatisticsResourceMetric"
        deletes:
          $ref: "#/components/schemas/StatisticsResourceMetric"
        scans:
          $ref: "#/components/schemas/StatisticsResourceMetric"
        iterated:
          $ref: "#/components/schemas/StatisticsResourceMetric"
        bytesRead:
          $ref: "#/components/schemas/StatisticsResourceMetric"
        bytesWritten:
          $ref: "#/components/schemas/StatisticsResourceMetric"

    StatisticsPhysicalCostMetric:
      type: object
      additionalProperties: false
      required: [p50UpperBound, p95UpperBound, maximumUpperBound]
      properties:
        p50UpperBound:
          type: integer
          format: int64
          description: Upper bound on the median value.
        p95UpperBound:
          type: integer
          format: int64
          description: Upper bound on the 95th-percentile value.
        maximumUpperBound:
          type: integer
          format: int64
          description: Upper bound on the largest value in the retained buckets.

    StatisticsPhysicalTelemetryCapabilities:
      type: object
      additionalProperties: false
      required: [requestLatency, requestBytes, requestConcurrency, cacheTiers, accessLocality]
      properties:
        requestLatency:
          type: boolean
        requestBytes:
          type: boolean
        requestConcurrency:
          type: boolean
        cacheTiers:
          type: boolean
        accessLocality:
          type: boolean

    StatisticsPhysicalRequestCost:
      type: object
      additionalProperties: false
      required: [class, observedRequests, errors]
      properties:
        class:
          type: string
          enum: [read, range_read, metadata_read, write, delete, list]
        observedRequests:
          type: integer
          format: int64
        errors:
          type: integer
          format: int64
        latencyMicros:
          $ref: "#/components/schemas/StatisticsPhysicalCostMetric"
        bytes:
          $ref: "#/components/schemas/StatisticsPhysicalCostMetric"
        sizeUpperBound:
          type: integer
          format: int64
          description: Request-size bucket upper bound for this conditional model.
        concurrencyUpperBound:
          type: integer
          format: int64
          description: Active-request bucket upper bound for this conditional model.
        serviceTier:
          type: string
          enum: [memory, local, remote]
          description: Service tier for this conditional model.

    StatisticsPhysicalCacheCost:
      type: object
      additionalProperties: false
      required: [tier, accesses, hits, hitRatePpm]
      properties:
        tier:
          type: string
          enum: [memory, local]
        accesses:
          type: integer
          format: int64
        hits:
          type: integer
          format: int64
        hitRatePpm:
          type: integer
          format: int64

    StatisticsPhysicalCost:
      type: object
      additionalProperties: false
      required: [basis, backend, telemetryFormat, capabilities, requests, caches]
      description: |
        Instance-local physical storage calibration. Backend adapters convert
        their native metrics to this common model. A missing capability is
        false and its measurements are absent. The model is not assigned to
        one statement or relation.
      properties:
        basis:
          type: string
          enum: [backend_physical_telemetry]
        backend:
          type: string
        telemetryFormat:
          type: integer
          format: int64
        capabilities:
          $ref: "#/components/schemas/StatisticsPhysicalTelemetryCapabilities"
        requests:
          type: array
          items: { $ref: "#/components/schemas/StatisticsPhysicalRequestCost" }
        caches:
          type: array
          items: { $ref: "#/components/schemas/StatisticsPhysicalCacheCost" }

    StatisticsPlanningValue:
      type: object
      additionalProperties: false
      required:
        [
          score,
          frequency,
          uncertaintyPpm,
          observedPlanVariationPpm,
          costDifferenceMicros,
          comparableExecutions,
          rowCountClassUpperBound,
          minimumExecutions,
          basis,
        ]
      description: |
        Observational priority proxy. It is present only when at least two
        plans have enough execution evidence in the same access generation
        and row-count class. It does not claim that an estimate caused a plan
        change. A future counterfactual optimizer can replace the observed
        A counterfactual optimizer replaces the observed plan-variation
        component without changing the other components.
      properties:
        score:
          type: integer
          format: int64
          description: |
            Frequency multiplied by normalized uncertainty, observed plan
            variation, and the median execution-time difference. The two
            normalized components use parts per million.
        frequency:
          type: integer
          format: int64
          description: Recent workload frequency used by the score.
        uncertaintyPpm:
          type: integer
          format: int64
          description: Normalized p95 q-error excess in parts per million.
        observedPlanVariationPpm:
          type: integer
          format: int64
          description: Non-dominant comparable plan executions in parts per million.
        costDifferenceMicros:
          type: integer
          format: int64
          description: Difference between the fastest and slowest comparable median execution times.
        comparableExecutions:
          type: integer
          format: int64
          description: Executions represented by the comparable plan group.
        rowCountClassUpperBound:
          type: integer
          format: int64
          description: Median row-count histogram bound shared by the plan group.
        minimumExecutions:
          type: integer
          format: int64
          description: Minimum estimates and per-plan executions required for admission.
        basis:
          type: string
          description: Stable identifier for the score method.

    SchemaState:
      type: object
      required: [schema_version, schema_hash, schema]
      properties:
        schema_version:
          type: integer
          format: int64
          minimum: 0
        schema_hash:
          type: string
        schema:
          $ref: "#/components/schemas/SchemaDocument"

    SchemaChange:
      type: object
      required: [kind, summary]
      properties:
        kind: { type: string }
        summary: { type: string }
        table: { type: string }
        column: { type: string }

    SchemaFinding:
      type: object
      required: [kind, summary]
      properties:
        kind: { type: string }
        summary: { type: string }
        table: { type: string }
        column: { type: string }
        rows:
          type: integer
          format: int64
          minimum: 0

    SchemaDiffResult:
      description: |
        An advisory point-in-time comparison with the desired schema. `program`
        is the work a newly accepted apply would currently need; it may omit a
        transition start when matching durable work is already in progress.
        Apply replans transactionally and returns its authoritative transition
        identities.
      type: object
      required:
        - current_version
        - current_hash
        - desired_hash
        - changes
        - program
        - destructive
        - blocking
      properties:
        current_version:
          type: integer
          format: int64
          minimum: 0
        current_hash: { type: string }
        desired_hash: { type: string }
        changes:
          type: array
          items: { $ref: "#/components/schemas/SchemaChange" }
        program: { $ref: "#/components/schemas/Value" }
        destructive:
          type: array
          items: { $ref: "#/components/schemas/SchemaFinding" }
        blocking:
          type: array
          items: { $ref: "#/components/schemas/SchemaFinding" }

    SchemaMigrateResult:
      allOf:
        - $ref: "#/components/schemas/SchemaState"
        - type: object
          required: [changes, desired_hash, state, transition_ids]
          properties:
            changes:
              type: array
              items: { $ref: "#/components/schemas/SchemaChange" }
            desired_hash:
              description: Canonical hash of the requested target schema.
              type: string
            state:
              description: Whether the current canonical schema has reached the requested target.
              type: string
              enum: [converging, ready]
            transition_ids:
              description: Durable online work whose publication converges the current schema toward the target.
              type: array
              items: { type: string }

    QueryResult:
      description: |
        The result of a query: one datum, shaped exactly as the root
        materialises. A `many` root is an array of records; `first` is a
        record or `null`; `exactly_one` is a record; `scalar` is a naked
        value or `null`. Nested `first` fields are objects (or `null`) and
        nested `array` fields are arrays, recursively.
      type: object
      required: [result]
      properties:
        result:
          allOf:
            - $ref: "#/components/schemas/Value"

    ProgramResult:
      description: |
        The result of a program: the declared result statement's datum (shaped
        exactly as its LIR root materialises, as in `QueryResult`), plus a
        per-statement summary in execution order.
      type: object
      required: [result, statements]
      properties:
        result:
          allOf:
            - $ref: "#/components/schemas/Value"
        statements:
          type: array
          items: { $ref: "#/components/schemas/StatementResult" }
        plan:
          description: |
            Present only when the request set `show-plan`. Free-form JSON: the
            query plan for each statement — the physical plan and the planner's
            access-path decisions, plus a rendered text form. Transport
            observability metadata, not part of the LIR/PIR IR; its structure is
            deliberately unspecified here and evolves with the planner.
          allOf:
            - $ref: "#/components/schemas/Value"

    StatementResult:
      description: |
        One statement's lightweight outcome. Durable schema work additionally
        returns a typed control object; relational and immediate catalog
        statements omit it.
      type: object
      required: [name, affected, control]
      properties:
        name:
          type: string
        affected:
          description: |
            For relational statements, the number of rows produced, created,
            updated, or deleted. A successful immediate catalog or transition
            start reports one affected object.
          type: integer
        control:
          description: |
            A typed non-relational result. Transition-start controls contain
            `kind: transition`, durable identities, lifecycle state and
            generation, retained-work health, advisory progress/lag, and
            terminal diagnostics. Worker ownership epochs and physical storage
            positions are internal and are not exposed. Statements without a
            control result emit JSON null. This namespace is not a LIR relation
            and cannot be referenced by a PIR `ref`.
          allOf:
            - $ref: "#/components/schemas/Value"

    TransitionKind:
      description: The physical protocol used to perform online schema work.
      type: string
      enum: [index_build, column_replacement, constraint_validation]

    TransitionState:
      description: The durable lifecycle state of online schema work.
      type: string
      enum:
        [waiting, building, catching_up, validating, ready, failed, cancelled]

    TransitionWorkState:
      description: |
        Advisory retained-work pressure. `write_gated` means affected writes
        are temporarily rejected until the worker catches up or terminates.
      type: string
      enum: [normal, degraded, write_gated]

    TransitionControl:
      description: |
        The administrative projection of a durable schema transition. Identity,
        protocol kind, lifecycle state, generation, prerequisite edges, and
        terminal diagnostics are normative. Progress and retained-work values
        are advisory snapshots.
        Worker epochs and physical storage positions remain internal.
      type: object
      additionalProperties: false
      required:
        - kind
        - transition_id
        - object_id
        - transition_kind
        - state
        - generation
        - prerequisites
        - retained_work_state
        - rows_scanned
        - applied_delta
        - delta_lag
      properties:
        kind:
          type: string
          enum: [transition]
        transition_id:
          type: string
        object_id:
          description: Stable logical identity of the index, column, or constraint being produced.
          type: string
        transition_kind:
          $ref: "#/components/schemas/TransitionKind"
        state:
          $ref: "#/components/schemas/TransitionState"
        generation:
          type: integer
          format: int64
          minimum: 0
        prerequisites:
          description: Durable transition identities that must publish ready before this transition can activate.
          type: array
          items: { type: string }
        retained_work_state:
          $ref: "#/components/schemas/TransitionWorkState"
        last_error:
          description: Terminal or most recent worker diagnostic, when present.
          type: string
        rows_scanned:
          type: integer
          format: int64
          minimum: 0
        applied_delta:
          type: integer
          format: int64
          minimum: 0
        delta_lag:
          type: integer
          format: int64
          minimum: 0

    TransitionList:
      description: A coherent administrative snapshot of durable schema transitions.
      type: object
      additionalProperties: false
      required: [transitions]
      properties:
        transitions:
          type: array
          items: { $ref: "#/components/schemas/TransitionControl" }

    TableUpdateProps:
      description: The table properties to update.
      type: object
      required: [name]
      properties:
        name:
          description: The table's new name.
          type: string

    ColumnUpdateProps:
      description: The column properties to update.
      type: object
      required: [name]
      properties:
        name:
          description: The column's new name.
          type: string
