name: Rad confidence campaigns

on:
  schedule:
    - cron: "17 12 * * *"
      timezone: Europe/London
  workflow_dispatch:
    inputs:
      dst_minutes:
        description: Wall-clock budget for deterministic schema simulation
        required: true
        default: 60
        type: number
      storage_minutes:
        description: Wall-clock budget for RustFS and Toxiproxy qualification
        required: true
        default: 60
        type: number
      generative_minutes:
        description: Wall-clock budget for generated LIR, PIR, models, and metamorphic checks
        required: true
        default: 60
        type: number

permissions:
  contents: read

concurrency:
  group: rad-confidence-${{ github.repository }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  RAD_SOURCE_REVISION: ${{ github.sha }}

jobs:
  dst:
    name: deterministic schema soak
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      CAMPAIGN_MINUTES: ${{ github.event_name == 'workflow_dispatch' && inputs.dst_minutes || '60' }}
      CARGO_TARGET_DIR: target
      RAD_TEST_ARTIFACT_DIR: ${{ github.workspace }}/artifacts/dst
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal

      - name: Restore Rust dependency cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          shared-key: native
          save-if: false

      - name: Run wall-clock deterministic campaign
        env:
          RAD_DST_SECONDS: ${{ env.CAMPAIGN_MINUTES }}
        run: |
          set -euo pipefail
          export RAD_DST_SECONDS="$((RAD_DST_SECONDS * 60))"
          mkdir -p "$RAD_TEST_ARTIFACT_DIR"
          cargo test --locked --test schema_scheduler_simulation turmoil_schema_work_soak -- --exact --ignored --nocapture \
            2>&1 | tee "$RAD_TEST_ARTIFACT_DIR/run.log"

      - name: Retain campaign manifest and failure traces
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rad-dst-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/dst
          if-no-files-found: error
          retention-days: 30

  generative:
    name: generative semantic soak
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      CAMPAIGN_MINUTES: ${{ github.event_name == 'workflow_dispatch' && inputs.generative_minutes || '60' }}
      CARGO_TARGET_DIR: target
      RAD_TEST_ARTIFACT_DIR: ${{ github.workspace }}/artifacts/generative
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal

      - name: Restore Rust dependency cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          shared-key: native
          save-if: false

      - name: Run wall-clock generated semantic campaign
        env:
          RAD_GEN_SOAK_SEED: ${{ github.run_id }}
        run: |
          set -euo pipefail
          export RAD_GEN_SOAK_SECONDS="$((CAMPAIGN_MINUTES * 60))"
          mkdir -p "$RAD_TEST_ARTIFACT_DIR"
          cargo test --locked --test generative_differential generative_semantic_soak -- --exact --ignored --nocapture \
            2>&1 | tee "$RAD_TEST_ARTIFACT_DIR/run.log"

      - name: Retain minimized fixtures and replay context
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rad-generative-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/generative
          if-no-files-found: error
          retention-days: 30

  storage:
    name: RustFS and Toxiproxy soak
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      CAMPAIGN_MINUTES: ${{ github.event_name == 'workflow_dispatch' && inputs.storage_minutes || '60' }}
      CARGO_TARGET_DIR: target
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal

      - name: Restore Rust dependency cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          shared-key: native
          save-if: false

      - name: Verify Docker daemon
        run: docker info

      - name: Repeatedly qualify RustFS through real process death and Toxiproxy
        run: |
          set -euo pipefail
          artifact_dir="$GITHUB_WORKSPACE/artifacts/storage"
          mkdir -p "$artifact_dir"
          deadline=$((SECONDS + CAMPAIGN_MINUTES * 60))
          iteration=0
          while (( SECONDS < deadline )); do
            iteration=$((iteration + 1))
            log="$artifact_dir/iteration-$iteration.log"
            {
              echo "revision=$GITHUB_SHA"
              echo "iteration=$iteration"
              echo "rustfs_image=rustfs/rustfs:1.0.0-beta.11@sha256:84ce557a0245a06a9aae5516f55ee0f007fca78d41df356f419306fdc0cb168c"
              echo "toxiproxy_image=ghcr.io/shopify/toxiproxy:2.12.0@sha256:9378ed52a28bc50edc1350f936f518f31fa95f0d15917d6eb40b8e376d1a214e"
              cargo test --locked --test kv_backend_qualification rustfs_backend_satisfies_the_storage_qualification_suite -- --exact --ignored --nocapture
              cargo test --locked --test storage_crash_recovery rustfs_backend_recovers_from_real_process_death -- --exact --ignored --nocapture
              cargo test --locked --test storage_network_faults rustfs_network_fault_matrix_preserves_commit_and_writer_safety -- --exact --ignored --nocapture
              RAD_TEST_ARTIFACT_DIR="$artifact_dir" RAD_TEST_S3_LATENCY_SEED="$((GITHUB_RUN_ID + iteration))" cargo test --locked --test s3_latency seeded_s3_latency_preserves_http_write_reopen_and_query_correctness -- --exact --ignored --nocapture
            } 2>&1 | tee "$log"
          done
          printf '{"format":"rad-storage-campaign-v1","revision":"%s","completed_iterations":%d,"requested_minutes":%d}\n' \
            "$GITHUB_SHA" "$iteration" "$CAMPAIGN_MINUTES" > "$artifact_dir/campaign.json"

      - name: Retain storage qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rad-storage-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/storage
          if-no-files-found: error
          retention-days: 30

  benchmark:
    name: stable S3 HTTP benchmark
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: target
      RAD_BENCHMARK_ARTIFACT_DIR: ${{ github.workspace }}/artifacts/benchmark
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal

      - name: Restore Rust dependency cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          shared-key: benchmark-release
          cache-targets: true

      - name: Verify Docker daemon
        run: docker info

      - name: Run stable workloads through HTTP and RustFS
        run: |
          set -euo pipefail
          mkdir -p "$RAD_BENCHMARK_ARTIFACT_DIR"
          cargo test --release --locked --test s3_http_benchmark -- --ignored --nocapture --test-threads=1 \
            2>&1 | tee "$RAD_BENCHMARK_ARTIFACT_DIR/run.log"

      - name: Retain benchmark measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rad-s3-http-benchmark-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/benchmark
          if-no-files-found: error
          retention-days: 90
