# Publish the current main build to a moving `edge` GitHub release. The stable
# asset names are consumed by the installers via releases/latest/download/.
#
# SlateDB is linked statically. The resulting binaries still use the platform
# libc/frameworks: macOS has no static libSystem, Linux uses glibc, and Windows
# uses the normal system DLLs.

name: release

on:
  workflow_run:
    workflows:
      - test
    types:
      - completed

permissions:
  contents: read

env:
  # Keep these aligned with slatedb.io/slatedb-go in go.mod. The commit is the
  # peeled target of the binding's annotated tag, not the mutable tag itself.
  SLATEDB_COMMIT: 3fe856c15c43f158236e978947ca0b4b6b071306
  SLATEDB_RUST_TOOLCHAIN: "1.91.1"
  SLATEDB_VERSION: v0.14.1

jobs:
  metadata:
    name: version
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Check out repository and tags
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Derive version
        id: version
        run: |
          set -euo pipefail
          version="$(git describe --always --tags --exclude edge)"
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "Building $version from ${{ github.event.workflow_run.head_sha }}"

  build:
    name: build (${{ matrix.goos }}-${{ matrix.goarch }})
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            goos: linux
            goarch: amd64
            cache_target: native
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            cache_target: native
          - runner: macos-14
            goos: darwin
            goarch: arm64
            cache_target: native
          - runner: windows-2022
            goos: windows
            goarch: amd64
            cache_target: x86_64-pc-windows-msvc
            rust_target: x86_64-pc-windows-msvc
            # Go adds a GNU linker script when native clang selects link.exe.
            # LLD is MSVC-compatible and makes Go skip that incompatible script.
            cc: clang -fuse-ld=lld
          - runner: windows-11-arm
            goos: windows
            goarch: arm64
            cache_target: aarch64-pc-windows-msvc
            rust_target: aarch64-pc-windows-msvc
            cc: clang
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Prepare SlateDB source
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          set -euo pipefail
          actual_version="$(go list -m slatedb.io/slatedb-go | cut -d' ' -f2)"
          if [ "$actual_version" != "$SLATEDB_VERSION" ]; then
            echo "go.mod uses SlateDB $actual_version; update the audited workflow pin" >&2
            exit 1
          fi
          git init slatedb-src
          git -C slatedb-src remote add origin https://github.com/slatedb/slatedb
          git -C slatedb-src fetch --depth 1 origin "$SLATEDB_COMMIT"
          git -C slatedb-src checkout --detach FETCH_HEAD

          rust_toolchain="$(sed -n 's/^channel = "\([^"]*\)"/\1/p' slatedb-src/rust-toolchain.toml)"
          if [ "$rust_toolchain" != "$SLATEDB_RUST_TOOLCHAIN" ]; then
            echo "SlateDB uses Rust $rust_toolchain; update the audited workflow pin" >&2
            exit 1
          fi
          rustup toolchain install "$rust_toolchain" --profile minimal
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/slatedb-target" >> "$GITHUB_ENV"
          echo "SLATEDB_CACHE_DIR=$RUNNER_TEMP/slatedb-cache" >> "$GITHUB_ENV"
          echo "RUSTUP_TOOLCHAIN=$rust_toolchain" >> "$GITHUB_ENV"

          if [ -n "$RUST_TARGET" ]; then
            rustup target add --toolchain "$rust_toolchain" "$RUST_TARGET"
          fi

      - name: Restore SlateDB build cache
        id: slatedb-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/slatedb-target
            ${{ runner.temp }}/slatedb-cache
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: slatedb-uniffi-release-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.cache_target }}-${{ env.SLATEDB_RUST_TOOLCHAIN }}-${{ env.SLATEDB_COMMIT }}

      - name: Build SlateDB native library
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
          SLATEDB_CACHE_HIT: ${{ steps.slatedb-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          target_arg=""
          libdir="$CARGO_TARGET_DIR/release"
          if [ -n "$RUST_TARGET" ]; then
            target_arg="$RUST_TARGET"
            libdir="$CARGO_TARGET_DIR/$RUST_TARGET/release"
          fi

          cargo_args=(
            --release
            -p slatedb-uniffi
            --manifest-path slatedb-src/Cargo.toml
          )
          if [ -n "$target_arg" ]; then
            cargo_args+=(--target "$target_arg")
          fi
          mkdir -p "$SLATEDB_CACHE_DIR"
          if [ "$SLATEDB_CACHE_HIT" != true ]; then
            cargo rustc \
              "${cargo_args[@]}" \
              -- \
              --print native-static-libs 2>&1 | tee "$SLATEDB_CACHE_DIR/build.log"
            grep -m1 -o 'native-static-libs: .*' "$SLATEDB_CACHE_DIR/build.log" \
              | sed 's/native-static-libs: //' > "$SLATEDB_CACHE_DIR/native-libs.txt"
          else
            echo "Using cached SlateDB native build"
          fi
          test -s "$SLATEDB_CACHE_DIR/native-libs.txt"

          static_dir="$PWD/lib/static"
          mkdir -p "$static_dir"
          static_lib="$(find "$libdir" -maxdepth 1 -type f \
            \( -name libslatedb_uniffi.a -o -name slatedb_uniffi.lib \) \
            -print -quit)"
          if [ -z "$static_lib" ]; then
            echo "SlateDB static library not found in $libdir" >&2
            find "$libdir" -maxdepth 1 -type f -print >&2
            exit 1
          fi
          cp "$static_lib" "$static_dir/"

          native_libs="$(cat "$SLATEDB_CACHE_DIR/native-libs.txt")"
          if [ "$RUNNER_OS" = Windows ]; then
            # rustc reports MSVC linker syntax, while cgo invokes Clang's
            # GCC-style driver. Make the flags compatible and colocate any
            # Cargo-provided import libraries with the SlateDB archive.
            clang_libs=()
            for native_lib in $native_libs; do
              case "$native_lib" in
                *.lib)
                  support_lib="$(find "$CARGO_TARGET_DIR" "$HOME/.cargo" "$HOME/.rustup" \
                    -type f -name "$native_lib" -print -quit 2>/dev/null)"
                  if [ -n "$support_lib" ]; then
                    cp "$support_lib" "$static_dir/"
                  elif [[ "$native_lib" == windows.*.lib ]]; then
                    echo "Cargo import library $native_lib not found" >&2
                    exit 1
                  fi
                  clang_libs+=("-l${native_lib%.lib}")
                  ;;
                /defaultlib:*) clang_libs+=("-Wl,$native_lib") ;;
                *) clang_libs+=("$native_lib") ;;
              esac
            done
            native_libs="${clang_libs[*]}"

            # CGO invokes native clang outside MSYS path translation.
            static_dir="$(cygpath -m "$static_dir")"
          fi
          echo "LIBDIR=$static_dir" >> "$GITHUB_ENV"
          echo "NATIVE_LIBS=$native_libs" >> "$GITHUB_ENV"

      - name: Build rad
        env:
          CC: ${{ matrix.cc }}
          CGO_ENABLED: "1"
          GOARCH: ${{ matrix.goarch }}
          GOOS: ${{ matrix.goos }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          extension=""
          extra_ldflags=""
          if [ "$GOOS" = windows ]; then extension=".exe"; fi
          if [ "$GOOS" = darwin ]; then extra_ldflags="-Wl,-w"; fi

          mkdir -p release-bin
          export CGO_LDFLAGS="-L$LIBDIR $NATIVE_LIBS $extra_ldflags"
          go build \
            -trimpath \
            -ldflags "-s -w -X main.version=$VERSION" \
            -o "release-bin/rad$extension" \
            ./cmd/rad
          "./release-bin/rad$extension" --version

      - name: Package
        env:
          GOARCH: ${{ matrix.goarch }}
          GOOS: ${{ matrix.goos }}
        run: |
          set -euo pipefail
          name="rad-$GOOS-$GOARCH"
          if [ "$GOOS" = windows ]; then
            (cd release-bin && 7z a "../$name.zip" rad.exe)
          else
            tar czf "$name.tar.gz" -C release-bin rad
          fi

      - name: Upload packaged binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rad-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            rad-*.tar.gz
            rad-*.zip
          if-no-files-found: error
          retention-days: 7

      - name: Save SlateDB build cache
        if: steps.slatedb-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/slatedb-target
            ${{ runner.temp }}/slatedb-cache
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.slatedb-cache.outputs.cache-primary-key }}

  release:
    name: publish edge release
    needs:
      - metadata
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download packaged binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Create checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum rad-* > SHA256SUMS
          cat SHA256SUMS

      - name: Publish moving edge release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail

          notes="Automated prototype build from \`$RELEASE_SHA\`. Binary version: \`$VERSION\`."
          if gh release view edge >/dev/null 2>&1; then
            gh release upload edge dist/* --clobber
            gh release edit edge \
              --title "Rad edge ($VERSION)" \
              --notes "$notes" \
              --latest
          else
            gh release create edge dist/* \
              --target "$RELEASE_SHA" \
              --title "Rad edge ($VERSION)" \
              --notes "$notes" \
              --latest
          fi
