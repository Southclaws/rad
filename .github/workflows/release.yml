# Publish the exact revision that passed the complete CI matrix to the
# moving `edge` release. Stable/tagged release policy belongs to the later CLI
# and versioning work; these artifacts are dogfood/staging-alpha evidence.

name: Rad release

on:
  workflow_run:
    workflows:
      - Rad CI
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: rad-release-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  REGISTRY_IMAGE: ghcr.io/southclaws/rad

jobs:
  metadata:
    name: version
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Check out tested revision and tags
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Derive build version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(git describe --always --tags --exclude edge)"
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "Building Rad alpha $version from ${{ github.event.workflow_run.head_sha }}"

  build:
    name: build (${{ matrix.platform }}, ${{ matrix.arch }})
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux
            arch: amd64
            extension: ""
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            extension: ""
          - runner: macos-15-intel
            platform: darwin
            arch: amd64
            extension: ""
          - runner: macos-15
            platform: darwin
            arch: arm64
            extension: ""
          - runner: windows-2025
            platform: windows
            arch: amd64
            extension: .exe
          - runner: windows-11-arm
            platform: windows
            arch: arm64
            extension: .exe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      CARGO_TARGET_DIR: target
    steps:
      - name: Check out tested revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal

      - name: Restore Rust release cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          shared-key: release

      - name: Build release binary
        run: cargo build --locked --release

      - name: Package release evidence
        env:
          BUILD_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          name="rad-${{ matrix.platform }}-${{ matrix.arch }}"
          mkdir -p package
          cp "$CARGO_TARGET_DIR/release/rad${{ matrix.extension }}" "package/rad${{ matrix.extension }}"
          printf '{"format":"rad-release-build-v1","version":"%s","revision":"%s","os":"%s","architecture":"%s","rust":"1.96.0"}\n' \
            "$BUILD_VERSION" "${{ github.event.workflow_run.head_sha }}" "${{ matrix.platform }}" "${{ matrix.arch }}" > package/BUILD.json
          if [ "${{ matrix.platform }}" = windows ]; then
            (cd package && 7z a "../$name.zip" "rad${{ matrix.extension }}" BUILD.json)
          else
            tar czf "$name.tar.gz" -C package "rad${{ matrix.extension }}" BUILD.json
          fi

      - name: Upload packaged binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rad-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            rad-*.tar.gz
            rad-*.zip
          if-no-files-found: error
          retention-days: 14

  container:
    name: container (${{ matrix.platform }})
    needs:
      - metadata
      - build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            artifact_arch: amd64
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            artifact_arch: arm64
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out tested packaging definition
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download native Linux binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rad-linux-${{ matrix.artifact_arch }}
          path: artifact

      - name: Prepare container context
        shell: bash
        run: |
          set -euo pipefail
          mkdir container
          tar xzf "artifact/rad-linux-${{ matrix.artifact_arch }}.tar.gz" \
            -C container rad BUILD.json
          test -x container/rad
          test -s container/BUILD.json

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build and push native image by digest
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: container
          file: packaging/container/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
            org.opencontainers.image.version=${{ needs.metadata.outputs.version }}
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=container-${{ matrix.artifact_arch }}
          cache-to: type=gha,mode=max,scope=container-${{ matrix.artifact_arch }}
          provenance: mode=max
          sbom: true

      - name: Retain image digest
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          digest="${IMAGE_DIGEST#sha256:}"
          test "$digest" != "$IMAGE_DIGEST"
          mkdir digests
          touch "digests/$digest"

      - name: Upload image digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rad-container-digest-${{ matrix.artifact_arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 14

  container-publish:
    name: publish container
    needs:
      - metadata
      - container
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download native image digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: rad-container-digest-*
          path: digests
          merge-multiple: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Publish multi-platform image index
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t digest_files < <(find digests -maxdepth 1 -type f | sort)
          test "${#digest_files[@]}" -eq 2

          sources=()
          for digest_file in "${digest_files[@]}"; do
            sources+=("$REGISTRY_IMAGE@sha256:$(basename "$digest_file")")
          done

          docker buildx imagetools create \
            --tag "$REGISTRY_IMAGE:latest" \
            --tag "$REGISTRY_IMAGE:edge" \
            --tag "$REGISTRY_IMAGE:sha-$RELEASE_SHA" \
            "${sources[@]}"

      - name: Verify and retain image index
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$REGISTRY_IMAGE:edge" |
            tee IMAGE.txt
          docker buildx imagetools inspect --raw "$REGISTRY_IMAGE:edge" \
            > IMAGE.json
          jq -e '
            [
              .manifests[].platform
              | select(.os != "unknown")
              | "\(.os)/\(.architecture)"
            ]
            | sort
            == ["linux/amd64", "linux/arm64"]
          ' IMAGE.json

      - name: Upload image index evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rad-container-manifest
          path: |
            IMAGE.json
            IMAGE.txt
          if-no-files-found: error
          retention-days: 14

  release:
    name: publish edge release
    needs:
      - metadata
      - build
      - container-publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download packaged binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Create checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum rad-*.tar.gz rad-*.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Publish moving edge release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          notes="Automated Rad dogfood/staging-alpha build from \`$RELEASE_SHA\`. Binary version: \`$VERSION\`. Six native OS/architecture artifacts and the \`ghcr.io/southclaws/rad:latest\` AMD64/ARM64 image were published only after the complete Rad CI matrix passed."
          if gh release view edge >/dev/null 2>&1; then
            gh release delete edge --cleanup-tag --yes
          fi
          set -- dist/rad-*.tar.gz dist/rad-*.zip
          if [ "$#" -ne 6 ]; then
            echo "expected six release archives, found $#" >&2
            exit 1
          fi
          for asset in "$@"; do
            if [ ! -s "$asset" ]; then
              echo "release archive is missing or empty: $asset" >&2
              exit 1
            fi
          done
          gh release create edge "$@" dist/SHA256SUMS \
            --target "$RELEASE_SHA" \
            --title "Rad edge ($VERSION)" \
            --notes "$notes" \
            --latest

  install-smoke:
    name: install (${{ matrix.platform }}, ${{ matrix.arch }})
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
          - runner: macos-15-intel
            platform: darwin
            arch: amd64
          - runner: macos-15
            platform: darwin
            arch: arm64
          - runner: windows-2025
            platform: windows
            arch: amd64
          - runner: windows-11-arm
            platform: windows
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out tested installer
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install and execute published binary
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          export RAD_VERSION=edge
          export RAD_INSTALL="$RUNNER_TEMP/rad-install"
          sh install/install.sh
          "$RAD_INSTALL/bin/rad" --version

      - name: Install and execute published binary
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:RAD_VERSION = "edge"
          $env:RAD_INSTALL = Join-Path $env:RUNNER_TEMP "rad-install"
          & ./install/install.ps1
          & (Join-Path $env:RAD_INSTALL "rad.exe") --version
