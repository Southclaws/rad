name: test

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # Keep these aligned with slatedb.io/slatedb-go in go.mod. The commit is the
  # peeled target of the binding's annotated tag, not the mutable tag itself.
  SLATEDB_COMMIT: 3fe856c15c43f158236e978947ca0b4b6b071306
  SLATEDB_VERSION: v0.14.1

jobs:
  test:
    name: full suite (linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build SlateDB native library
        run: |
          set -euo pipefail
          actual_version="$(go list -m slatedb.io/slatedb-go | cut -d' ' -f2)"
          if [ "$actual_version" != "$SLATEDB_VERSION" ]; then
            echo "go.mod uses SlateDB $actual_version; update the audited workflow pin" >&2
            exit 1
          fi
          git init /tmp/slatedb
          git -C /tmp/slatedb remote add origin https://github.com/slatedb/slatedb
          git -C /tmp/slatedb fetch --depth 1 origin "$SLATEDB_COMMIT"
          git -C /tmp/slatedb checkout --detach FETCH_HEAD
          cargo build \
            --release \
            -p slatedb-uniffi \
            --manifest-path /tmp/slatedb/Cargo.toml
          mkdir -p "$GITHUB_WORKSPACE/lib"
          cp /tmp/slatedb/target/release/libslatedb_uniffi.so "$GITHUB_WORKSPACE/lib/"

      # Keep this in lockstep with `task test`: tests use the dynamic library
      # with an rpath, while release binaries use the isolated static archive.
      - name: Run full test suite
        env:
          CGO_ENABLED: "1"
          RAPID_CHECKS: "20"
        run: |
          set -euo pipefail
          export CGO_LDFLAGS="-L$GITHUB_WORKSPACE/lib -Wl,-rpath,$GITHUB_WORKSPACE/lib"
          go test ./...
          (cd examples/demo && go build -o /dev/null .)
