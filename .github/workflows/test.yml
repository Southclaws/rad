name: test

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # Keep these aligned with slatedb.io/slatedb-go in go.mod. The commit is the
  # peeled target of the binding's annotated tag, not the mutable tag itself.
  SLATEDB_COMMIT: 3fe856c15c43f158236e978947ca0b4b6b071306
  SLATEDB_VERSION: v0.14.1

jobs:
  test:
    name: full suite (linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Prepare SlateDB source
        id: slatedb
        run: |
          set -euo pipefail
          actual_version="$(go list -m slatedb.io/slatedb-go | cut -d' ' -f2)"
          if [ "$actual_version" != "$SLATEDB_VERSION" ]; then
            echo "go.mod uses SlateDB $actual_version; update the audited workflow pin" >&2
            exit 1
          fi
          git init /tmp/slatedb
          git -C /tmp/slatedb remote add origin https://github.com/slatedb/slatedb
          git -C /tmp/slatedb fetch --depth 1 origin "$SLATEDB_COMMIT"
          git -C /tmp/slatedb checkout --detach FETCH_HEAD

          rust_toolchain="$(sed -n 's/^channel = "\([^"]*\)"/\1/p' /tmp/slatedb/rust-toolchain.toml)"
          rustup toolchain install "$rust_toolchain" --profile minimal
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/slatedb-target" >> "$GITHUB_ENV"
          echo "RUSTUP_TOOLCHAIN=$rust_toolchain" >> "$GITHUB_ENV"
          echo "rust-toolchain=$rust_toolchain" >> "$GITHUB_OUTPUT"

      - name: Restore SlateDB build cache
        id: slatedb-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/slatedb-target
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: slatedb-uniffi-release-v1-${{ runner.os }}-${{ runner.arch }}-native-${{ steps.slatedb.outputs.rust-toolchain }}-${{ env.SLATEDB_COMMIT }}

      - name: Build SlateDB native library
        run: |
          set -euo pipefail
          cargo rustc \
            --release \
            -p slatedb-uniffi \
            --manifest-path /tmp/slatedb/Cargo.toml \
            -- \
            --print native-static-libs
          mkdir -p "$GITHUB_WORKSPACE/lib"
          cp "$CARGO_TARGET_DIR/release/libslatedb_uniffi.so" "$GITHUB_WORKSPACE/lib/"

      # Keep this in lockstep with `task test`: tests use the dynamic library
      # with an rpath, while release binaries use the isolated static archive.
      - name: Run full test suite
        env:
          CGO_ENABLED: "1"
          RAPID_CHECKS: "20"
        run: |
          set -euo pipefail
          export CGO_LDFLAGS="-L$GITHUB_WORKSPACE/lib -Wl,-rpath,$GITHUB_WORKSPACE/lib"
          go test ./...
          (cd examples/demo && go build -o /dev/null .)

      # Pull requests may restore the trusted main cache, but only successful
      # pushes can populate a branch cache.
      - name: Save SlateDB build cache
        if: github.event_name == 'push' && steps.slatedb-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/slatedb-target
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.slatedb-cache.outputs.cache-primary-key }}
