name: test

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # Keep these aligned with slatedb.io/slatedb-go in go.mod. The commit is the
  # peeled target of the binding's annotated tag, not the mutable tag itself.
  SLATEDB_COMMIT: 3fe856c15c43f158236e978947ca0b4b6b071306
  SLATEDB_VERSION: v0.14.1

jobs:
  test:
    name: full suite (linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build SlateDB native library
        run: |
          set -euo pipefail
          actual_version="$(go list -m slatedb.io/slatedb-go | cut -d' ' -f2)"
          if [ "$actual_version" != "$SLATEDB_VERSION" ]; then
            echo "go.mod uses SlateDB $actual_version; update the audited workflow pin" >&2
            exit 1
          fi
          git init /tmp/slatedb
          git -C /tmp/slatedb remote add origin https://github.com/slatedb/slatedb
          git -C /tmp/slatedb fetch --depth 1 origin "$SLATEDB_COMMIT"
          git -C /tmp/slatedb checkout --detach FETCH_HEAD
          cargo rustc \
            --release \
            -p slatedb-uniffi \
            --manifest-path /tmp/slatedb/Cargo.toml \
            -- \
            --print native-static-libs 2>&1 | tee /tmp/slatedb-build.log
          grep -m1 -o 'native-static-libs: .*' /tmp/slatedb-build.log \
            | sed 's/native-static-libs: //' > /tmp/slatedb-native-libs.txt

      # Keep this in lockstep with `task test`: the static library makes the
      # runner self-contained, while the commands and RAPID_CHECKS are the same.
      - name: Run full test suite
        env:
          CGO_ENABLED: "1"
          RAPID_CHECKS: "20"
        run: |
          set -euo pipefail
          export CGO_LDFLAGS="-L/tmp/slatedb/target/release $(cat /tmp/slatedb-native-libs.txt)"
          go test ./...
          (cd examples/demo && go build -o /dev/null .)
