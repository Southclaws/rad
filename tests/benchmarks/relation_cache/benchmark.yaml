format: rad-relation-cache-benchmark-v2
name: relation-cache-policy
description: Deterministic relation cache policy workloads with explicit generation and request schedules.
scenarios:
  - name: stable_dimension
    expected: useful
    shape: { mutation_pattern: none, read_pattern: exact_repeat, literal_distribution: constant }
    steps:
      - { type: query, query: stable, count: 100 }
  - name: useful_hot_feed
    expected: useful
    shape: { mutation_pattern: append, read_pattern: range_tail, literal_distribution: constant }
    steps:
      - type: repeat
        count: 20
        steps:
          - { type: mutation, table: items, count: 1, payload_bytes: 32 }
          - { type: commit }
          - { type: query, query: tail, count: 5 }
          - { type: time_advance, milliseconds: 50 }
  - name: wasteful_hot_feed
    expected: wasteful
    shape: { mutation_pattern: append, read_pattern: range_tail, literal_distribution: constant }
    steps:
      - type: repeat
        count: 20
        steps:
          - { type: mutation, table: items, count: 1, payload_bytes: 32 }
          - { type: commit }
          - { type: query, query: tail, count: 1 }
          - { type: time_advance, milliseconds: 50 }
  - name: unrelated_point_updates
    expected: useful
    shape: { mutation_pattern: uniform_point, read_pattern: exact_repeat, literal_distribution: constant }
    steps:
      - type: repeat
        count: 20
        steps:
          - { type: mutation, table: items, mutation_pattern: uniform_point, count: 1, payload_bytes: 16 }
          - { type: commit }
          - { type: query, query: point-0000, count: 5 }
  - name: relevant_point_updates
    expected: useful
    shape: { mutation_pattern: hot_set, read_pattern: exact_repeat, literal_distribution: constant }
    steps:
      - type: repeat
        count: 20
        steps:
          - { type: mutation, table: items, mutation_pattern: hot_set, hot_set_size: 1, count: 1, payload_bytes: 16 }
          - { type: commit }
          - { type: query, query: point-0000, count: 5 }
  - name: closed_append_range
    expected: useful
    shape: { mutation_pattern: append, read_pattern: historical_range, literal_distribution: constant }
    steps:
      - type: repeat
        count: 20
        steps:
          - { type: mutation, table: items, count: 1, payload_bytes: 16 }
          - { type: commit }
          - { type: query, query: closed-range, count: 5 }
  - name: moving_append_tail
    expected: useful
    shape: { mutation_pattern: append, read_pattern: range_tail, literal_distribution: constant }
    steps:
      - type: repeat
        count: 20
        steps:
          - { type: mutation, table: items, count: 1, payload_bytes: 16 }
          - { type: commit }
          - { type: query, query: tail, count: 5 }
  - name: burst_mutation
    expected: useful
    shape: { mutation_pattern: burst, read_pattern: exact_repeat, literal_distribution: constant }
    steps:
      - { type: mutation, table: items, count: 100, payload_bytes: 16 }
      - { type: commit }
      - { type: query, query: stable, count: 20 }
  - name: continuous_mutation
    expected: wasteful
    shape: { mutation_pattern: append, read_pattern: exact_repeat, literal_distribution: constant }
    steps:
      - type: repeat
        count: 20
        steps:
          - { type: mutation, table: items, count: 5, payload_bytes: 16 }
          - { type: commit }
          - { type: query, query: stable, count: 1 }
  - name: domain_split
    expected: useful
    shape: { mutation_pattern: append, read_pattern: join, literal_distribution: constant }
    steps:
      - type: repeat
        count: 20
        steps:
          - { type: mutation, table: facts, count: 1, payload_bytes: 16 }
          - { type: commit }
          - { type: query, query: join, count: 3 }
  - name: density_pair
    expected: mixed
    shape: { mutation_pattern: none, read_pattern: mixed, literal_distribution: constant }
    steps:
      - { type: query, query: point-0000, count: 10 }
      - { type: query, query: stable, count: 10 }
  - name: literal_fanout
    expected: mixed
    shape: { mutation_pattern: none, read_pattern: mixed, literal_distribution: monotonic }
    steps:
      - type: repeat
        count: 100
        steps:
          - { type: query, query: next-point, count: 1 }
      - type: repeat
        count: 10
        steps:
          - { type: query, query: point-0000, count: 1 }
  - name: concurrent_fill
    expected: useful
    shape: { mutation_pattern: none, read_pattern: exact_repeat, literal_distribution: constant }
    steps:
      - { type: concurrent_query, query: stable, count: 32 }
      - { type: barrier }
  - name: multiple_dependencies
    expected: useful
