      - { type: mutation, table: items, count: 1, payload_bytes: 16 }
      - { type: commit }
      - { type: query, query: stable, count: 2 }
      - { type: time_advance, milliseconds: 100 }
      - { type: pinned_query, query: stable, count: 2 }
      - { type: release_snapshot }
      - { type: query, query: stable, count: 2 }
  - name: capacity_competition
    expected: mixed
    shape: { mutation_pattern: none, read_pattern: mixed, literal_distribution: constant }
    cache_capacity_bytes: 32768
    cache_entry_limit: 2
    result_limit_bytes: 16384
    steps:
      - { type: query, query: stable, count: 2 }
      - { type: query, query: join, count: 2 }
      - { type: query, query: tail, count: 2 }
      - { type: query, query: point-0000, count: 2 }
  - name: hard_result_limit
    expected: rejected
    shape: { mutation_pattern: append, read_pattern: exact_repeat, literal_distribution: constant }
    result_limit_bytes: 128
    steps:
      - { type: mutation, table: items, count: 10, payload_bytes: 4096 }
      - { type: commit }
      - { type: query, query: stable, count: 3 }
