          - { type: commit }
          - { type: query, query: tail, count: 1 }
          - { type: time_advance, milliseconds: 50 }
      - { type: checkpoint, name: wasteful_phase }
      - type: repeat
        count: 12
        steps:
          - { type: mutation, table: items, count: 1, payload_bytes: 32 }
          - { type: commit }
          - { type: query, query: tail, count: 5 }
          - { type: time_advance, milliseconds: 50 }
