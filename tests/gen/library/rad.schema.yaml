# A schema within the shape the generator drives: every table has a single text
# "id" primary key, an optional nullable text foreign key to an earlier table,
# and non-unique secondary indexes. The generator synthesises data and
# bind-valid queries against it, and the differential holds the engine's chosen
# plan equal to the reference interpreter.
tables:
  - id: 1
    name: authors
    columns:
      - { id: 1, name: id,     type: string, pk: true }
      - { id: 2, name: name,   type: string }
      - { id: 3, name: rating, type: int64, nullable: true }
      - { id: 4, name: active, type: bool }
    indexes:
      - { columns: [rating] }

  - id: 2
    name: books
    columns:
      - { id: 1, name: id,        type: string, pk: true }
      - { id: 2, name: title,     type: string }
      - { id: 3, name: pages,     type: int64 }
      - { id: 4, name: price,     type: float64, nullable: true }
      - { id: 5, name: author_id, type: string, nullable: true, ref: authors.id }
    indexes:
      - { columns: [pages] }
