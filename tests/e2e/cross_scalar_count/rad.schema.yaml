# e2e/cross_scalar_count — each board embeds a `scalar(...)` correlated
# aggregate: the count of its tasks (one output column, global fold).
tables:
  - id: 1
    name: boards
    columns:
      - { id: 1, name: id,   type: string, pk: true }
      - { id: 2, name: name, type: string }

  - id: 2
    name: tasks
    columns:
      - { id: 1, name: id,       type: string, pk: true }
      - { id: 2, name: board_id, type: string, nullable: true, ref: boards.id }
      - { id: 3, name: title,    type: string }
