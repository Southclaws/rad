# e2e/f3vl_bool_column_direct — a filter whose predicate is a bare bool column
# (no comparison), and its not(). The column is nullable, so it also shows that
# both `flag` and `not(flag)` drop the NULL row (UNKNOWN, and not UNKNOWN =
# UNKNOWN) — the two do not partition the table.
tables:
  - id: 1
    name: t
    columns:
      - { id: 1, name: id,   type: string, pk: true }
      - { id: 2, name: flag, type: bool, nullable: true }
