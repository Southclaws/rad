# e2e/create_task — minimal schema for this test only: just enough of the
# tracker domain (teams, users, boards, tasks) to seed a board with one task
# and confirm a program that creates a second task lands correctly.

tables:
  - id: 1
    name: teams
    columns:
      - { id: 1, name: id,         type: string, pk: true, format: uuid }
      - { id: 2, name: name,       type: string, unique: true }

  - id: 2
    name: users
    columns:
      - { id: 1, name: id,       type: string, pk: true, format: uuid }
      - { id: 2, name: username, type: string, unique: true }

  - id: 3
    name: boards
    columns:
      - { id: 1, name: id,       type: string, pk: true, format: uuid }
      - { id: 2, name: team_id,  type: string, ref: teams.id }
      - { id: 3, name: name,     type: string }
      - { id: 4, name: archived, type: bool, default: false }
    indexes:
      - { columns: [team_id, name], unique: true }

  - id: 4
    name: tasks
    columns:
      - { id: 1, name: id,         type: string, pk: true, format: uuid }
      - { id: 2, name: board_id,   type: string, ref: boards.id }
      - { id: 3, name: title,      type: string }
      - { id: 4, name: status,     type: string, default: todo }
      - { id: 5, name: priority,   type: int64, default: 2 }
      - { id: 6, name: creator_id, type: string, ref: users.id }
      - { id: 7, name: created_at, type: int64, format: unix_ms }
    indexes:
      - { columns: [board_id, status] }
