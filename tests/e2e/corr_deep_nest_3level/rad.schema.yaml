# 3-level correlated nesting: parent -> array(children) -> array(grandchildren)
# and each grandchild embeds scalar(count of its child's grandchildren). Tests
# batching/attach across three levels with no cross-parent leakage.
tables:
  - id: 1
    name: parents
    columns:
      - { id: 1, name: id, type: string, pk: true }

  - id: 2
    name: children
    columns:
      - { id: 1, name: id,        type: string, pk: true }
      - { id: 2, name: parent_id, type: string, nullable: true, ref: parents.id }

  - id: 3
    name: grandchildren
    columns:
      - { id: 1, name: id,       type: string, pk: true }
      - { id: 2, name: child_id, type: string, nullable: true, ref: children.id }
