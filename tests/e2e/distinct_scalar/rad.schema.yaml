# e2e/distinct_scalar — SELECT DISTINCT over a repeating scalar column: project
# a category off many products, distinct collapses the duplicates, and an
# explicit order above it makes the deduped set deterministic.
tables:
  - id: 1
    name: products
    columns:
      - { id: 1, name: id,       type: string, pk: true }
      - { id: 2, name: category, type: string }
