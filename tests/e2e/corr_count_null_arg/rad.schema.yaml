# count() whose argument is a correlated scalar(min child value). Parents with
# no children yield a NULL scalar (min over empty), which count must SKIP.
tables:
  - id: 1
    name: parents
    columns:
      - { id: 1, name: id, type: string, pk: true }

  - id: 2
    name: children
    columns:
      - { id: 1, name: id,        type: string, pk: true }
      - { id: 2, name: parent_id, type: string, nullable: true, ref: parents.id }
      - { id: 3, name: value,     type: int64 }
