# e2e/mut_update_ambiguous — a negative fixture: an update whose `rows`
# relation names the same primary key twice must fail with
# mutation_target_ambiguous (the batch cannot resolve one row from two images).
tables:
  - id: 1
    name: items
    columns:
      - { id: 1, name: id,   type: string, pk: true }
      - { id: 2, name: name, type: string }
