# e2e/agg_group_then_order — group by a column, then order the groups by an
# aggregate term (per-group count, descending).
tables:
  - id: 1
    name: sales
    columns:
      - { id: 1, name: id,     type: string, pk: true }
      - { id: 2, name: region, type: string }
      - { id: 3, name: amount, type: int64 }
