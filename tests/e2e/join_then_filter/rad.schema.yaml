# e2e/join_then_filter — a filter stacked above an inner join, keeping only the
# combined rows whose (right-side) department name matches, proving relational
# closure: the filter addresses a joined attribute exactly like a scanned one.
tables:
  - id: 1
    name: departments
    columns:
      - { id: 1, name: dept_id,   type: string, pk: true }
      - { id: 2, name: dept_name, type: string }

  - id: 2
    name: employees
    columns:
      - { id: 1, name: emp_id,   type: string, pk: true }
      - { id: 2, name: emp_name, type: string }
      - { id: 3, name: emp_dept, type: string, nullable: true, ref: departments.dept_id }
