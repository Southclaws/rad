# e2e/distinct_null_identity — distinct treats NULL as equal to NULL (unlike
# three-valued predicate equality, where NULL = NULL is unknown). Several events
# carry a null kind; distinct collapses them to a single null row alongside the
# distinct non-null kinds.
tables:
  - id: 1
    name: events
    columns:
      - { id: 1, name: id,   type: string, pk: true }
      - { id: 2, name: kind, type: string, nullable: true }
