# e2e/concatenate_distinct_union — set union is the composition distinct
# over concatenate: the row both inputs produce (Ada) collapses to one
# occurrence, under distinct's canonical full-row identity.
tables:
  - id: 1
    name: people
    columns:
      - { id: 1, name: id,   type: string, pk: true }
      - { id: 2, name: name, type: string }
      - { id: 3, name: team, type: string }
      - { id: 4, name: age,  type: int64 }
